document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'IBM Plex Sans Thai';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"87282252-cef1-4011-9558-039290010592\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* thai */\n@font-face {\n  font-family: 'IBM Plex Sans Thai';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e18b6ff9-7a5b-4e68-a806-882072e39c86\") format('woff2');\n  unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Sans Thai';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"647de3f9-ef87-4295-b8c1-11319295e02d\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans Thai';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8d80741c-9833-43df-a12a-88ea165a4d64\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body{margin:0;background:#F4F1EA}\n  doc-page:not(:defined){visibility:hidden}\n  a{color:#8A6D3B}\n  a:hover{color:#C9A961}\n<\u002Fstyle>\n<script src=\"5d0d29a5-dc5e-4a84-b62b-10512d626adb\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n<doc-page margin=\"0.7in\" style=\"font-family:'IBM Plex Sans Thai',sans-serif;color:#2C2A25;font-size:11pt;line-height:1.75\">\n\n  <div slot=\"footer\" style=\"display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid #E4DED2;font-size:8.5pt;color:#A29B8C\">\n    <span>Wellcon Interior Co., Ltd. — คู่มือการใช้งานระบบบริหารโครงการ<\u002Fspan>\n    <span>ฉบับ 2 ก.ย. 2569 · v1.155.0<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"background:#1C1B18;color:#F4EFE6;padding:26px 30px;border-radius:14px;margin-bottom:26px\">\n    <div style=\"font-size:8.5pt;letter-spacing:.22em;color:#C9A961;font-weight:600\">WELLCON PROJECT SUITE<\u002Fdiv>\n    <div style=\"font-family:'Cormorant Garamond',serif;font-size:30pt;line-height:1.1;margin-top:6px\">คู่มือการใช้งานระบบ<\u002Fdiv>\n    <div style=\"font-size:10.5pt;color:#CFC7B6;margin-top:8px;max-width:78%\">ระบบบริหารงานตกแต่งภายใน — แบบก่อสร้าง วัสดุ จัดซื้อ คลังพัสดุ การเงิน และทีมงาน · ใช้งานผ่านเบราว์เซอร์ ข้อมูลใช้ร่วมกันทุกคนแบบเรียลไทม์<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:19pt;color:#1C1B18;margin:0 0 4px;border-bottom:2px solid #C9A961;padding-bottom:6px\">1 · เริ่มต้นใช้งาน<\u002Fh2>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">เข้าสู่ระบบ<\u002Fh3>\n  <p style=\"margin:0 0 10px\">เปิด <b>project-management-1-weld.vercel.app<\u002Fb> จากเบราว์เซอร์ใดก็ได้ (คอมพิวเตอร์ / มือถือ / แท็บเล็ต) แล้วกรอก<\u002Fp>\n  <ul style=\"margin:0 0 12px;padding-left:20px\">\n    <li><b>ชื่อผู้ใช้<\u002Fb> — ชื่อภาษาอังกฤษของคุณ เช่น <code style=\"background:#EFEAE0;padding:1px 5px;border-radius:4px\">kanapong<\u002Fcode> · <code style=\"background:#EFEAE0;padding:1px 5px;border-radius:4px\">nuttha<\u002Fcode> (ไม่ต้องพิมพ์ @wellcon.co.th)<\u002Fli>\n    <li><b>รหัสผ่าน<\u002Fb> — ค่าเริ่มต้น <code style=\"background:#EFEAE0;padding:1px 5px;border-radius:4px\">1234<\u002Fcode><\u002Fli>\n  <\u002Ful>\n  <div style=\"background:#FBF6EC;border:1px solid #E2CFA6;border-radius:10px;padding:12px 15px;margin-bottom:14px;break-inside:avoid\">\n    <b style=\"color:#8A5A1E\">⚠ ควรเปลี่ยนรหัสผ่านทันทีที่เข้าครั้งแรก<\u002Fb><br>\n    กดชื่อคุณมุมขวาบน → <b>เปลี่ยนรหัสผ่าน<\u002Fb> → ตั้งรหัสใหม่อย่างน้อย 4 ตัว\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">ติดตั้งเป็นแอปบนมือถือ<\u002Fh3>\n  <p style=\"margin:0 0 14px\"><b>iPhone:<\u002Fb> เปิดใน Safari → ปุ่มแชร์ → “เพิ่มไปยังหน้าจอโฮม” &nbsp;·&nbsp; <b>Android:<\u002Fb> เปิดใน Chrome → เมนู ⋮ → “ติดตั้งแอป” — จะได้ไอคอนเปิดเต็มจอเหมือนแอปทั่วไป<\u002Fp>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">เปลี่ยนรูปโปรไฟล์<\u002Fh3>\n  <p style=\"margin:0 0 16px\">กดชื่อคุณมุมขวาบน → <b>เปลี่ยนรูปโปรไฟล์<\u002Fb> → เลือกรูป — รูปจะขึ้นในการ์ดทีม ตารางบุคลากร และเหรียญคะแนนของคุณทันที<\u002Fp>\n\n  <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:19pt;color:#1C1B18;margin:24px 0 4px;border-bottom:2px solid #C9A961;padding-bottom:6px\">2 · โครงสร้างหน้าจอ<\u002Fh2>\n\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:10pt;margin:14px 0 16px\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"text-align:left;background:#F1EDE2;border:1px solid #DED7C8;padding:8px 11px;font-size:9pt;color:#6E695E;width:32%\">เมนู<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left;background:#F1EDE2;border:1px solid #DED7C8;padding:8px 11px;font-size:9pt;color:#6E695E\">ใช้ทำอะไร<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>โครงการ<\u002Fb> (แถบบนสุด)<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">โครงการที่คุณได้รับมอบหมาย พร้อม % ความคืบหน้า — กดเข้าเพื่อดูรายละเอียด<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>งานของฉัน<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">งานที่ถูกมอบหมายให้คุณทุกโครงการรวมกัน + จำนวนงานค้าง<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>ขอบเขตความรับผิดชอบ<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ตาราง RACI ใครรับผิดชอบงานไหนในแต่ละโครงการ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>ธนาคาร · วงเงิน &amp; หลักประกัน<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">วงเงินโครงการ หนังสือค้ำประกัน (LG) และสถานะการเงิน<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>บุคลากร &amp; สิทธิ์<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">รายชื่อผู้ใช้ สิทธิ์เข้าถึง และการมอบหมายโครงการ (เฉพาะผู้ดูแล/ผู้จัดการ)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>คลังพัสดุ<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">สต็อกวัสดุ การเบิก-จ่าย และคลังไซต์แยกตามโครงการ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>QS Tracking<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ติดตาม BOQ ใบเสนอราคา และงานเพิ่ม-ลด (VO)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>ออกแบบฟอร์มเอกสาร<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">สร้างเอกสารมาตรฐานบริษัท เช่น RFI, MOM, หนังสือส่งมอบ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>ขอบเขตงาน · JD<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">Job Description ทุกตำแหน่งในบริษัท พร้อม KPI<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>บุคลากร (HR)<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ทะเบียนพนักงาน แผนก และข้อมูลบุคคล<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">หน้าในโครงการ<\u002Fh3>\n  <p style=\"margin:0 0 16px\">เมื่อเข้าโครงการแล้ว ใช้ <b>dropdown “หน้าในโครงการ”<\u002Fb> ด้านบนเพื่อสลับระหว่าง: ภาพรวม · แบบก่อสร้าง (Drawing Log) · วัสดุ (Material Log) · BOQ · งานเพิ่ม-ลด (VO) · วางบิล · แผนงาน · รายงานหน้าไซต์<\u002Fp>\n\n  <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:19pt;color:#1C1B18;margin:24px 0 4px;border-bottom:2px solid #C9A961;padding-bottom:6px\">3 · งานประจำวัน<\u002Fh2>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">แก้ไขข้อมูล<\u002Fh3>\n  <p style=\"margin:0 0 12px\">ทุกช่องในตารางแก้ได้โดยตรง — คลิกที่ช่อง พิมพ์ แล้วคลิกที่อื่น ข้อมูลจะบันทึกขึ้นเซิร์ฟเวอร์อัตโนมัติภายใน <b>1–2 วินาที<\u002Fb> ทุกคนเห็นตรงกัน <b>ไม่ต้องกดปุ่มบันทึก<\u002Fb><\u002Fp>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">อัปโหลดไฟล์แบบ<\u002Fh3>\n  <p style=\"margin:0 0 12px\">ที่ Drawing Log กด <b>Upload<\u002Fb> ในแถวของแบบนั้น → เลือกไฟล์ (PDF / รูป) — ไฟล์จะแสดงเป็นภาพย่อ กดดูเต็มจอได้ และบันทึกวันที่ส่งให้อัตโนมัติ<\u002Fp>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">ค้นหา<\u002Fh3>\n  <p style=\"margin:0 0 12px\">ช่องค้นหาทุกหน้าไฮไลต์ตัวอักษรที่ตรงด้วย<span style=\"background:#F3E4C0;color:#6E5424;padding:1px 4px;border-radius:3px\">พื้นสีทอง<\u002Fspan> ค้นได้จากชื่อ รหัส เลขที่แบบ หรือชื่อเล่น<\u002Fp>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">ส่งออก Excel<\u002Fh3>\n  <p style=\"margin:0 0 16px\">ตารางส่วนใหญ่มีปุ่ม <b>ดาวน์โหลด (Excel)<\u002Fb> — ได้ไฟล์ .xlsx เปิดใน Excel ได้ทันที บางหน้ามี <b>อัปเดตจาก Excel<\u002Fb> ให้แก้ในไฟล์แล้วนำกลับเข้าระบบ<\u002Fp>\n\n  <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:19pt;color:#1C1B18;margin:24px 0 4px;border-bottom:2px solid #C9A961;padding-bottom:6px\">4 · สิทธิ์การใช้งาน<\u002Fh2>\n\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:10pt;margin:14px 0 14px\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"text-align:left;background:#F1EDE2;border:1px solid #DED7C8;padding:8px 11px;font-size:9pt;color:#6E695E;width:36%\">บทบาท<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left;background:#F1EDE2;border:1px solid #DED7C8;padding:8px 11px;font-size:9pt;color:#6E695E\">เห็นอะไร · ทำอะไรได้<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>Super Admin<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ทุกอย่าง รวมเครื่องมือขั้นสูงและการจัดการผู้ใช้<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>กรรมการบริษัท (Director)<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">เห็นทุกโครงการ ทุกตัวเลข · จัดทีมโครงการได้<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>ผู้จัดการฝ่าย<\u002Fb> (PM / Design / QS / Finance / HR)<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">เห็นทุกโครงการในสายงานตน · <b>มอบหมาย แก้ไข และลบสมาชิกทีมโครงการได้<\u002Fb><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>PM · ผู้ควบคุมงาน · Designer · QS · จัดซื้อ<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">เห็นเฉพาะโครงการที่ถูกมอบหมาย แก้ไขงานในความรับผิดชอบ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\"><b>สโตร์ · หัวหน้าช่าง · ธุรการ · จป.<\u002Fb><\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">เห็นเฉพาะเมนูที่เกี่ยวข้องกับงานตน<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <p style=\"margin:0 0 16px;font-size:10pt;color:#6E695E\">ถ้าเข้าโครงการที่ควรเห็นไม่ได้ — แจ้งผู้จัดการฝ่ายหรือ Super Admin ให้เพิ่มคุณเข้าทีมโครงการนั้น<\u002Fp>\n\n  <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:19pt;color:#1C1B18;margin:24px 0 4px;border-bottom:2px solid #C9A961;padding-bottom:6px\">5 · จัดทีมโครงการ <span style=\"font-family:'IBM Plex Sans Thai';font-size:9.5pt;color:#A29B8C;font-weight:400\">— ระดับผู้จัดการขึ้นไป<\u002Fspan><\u002Fh2>\n\n  <p style=\"margin:12px 0 10px\">เข้าโครงการ → การ์ด <b>ทีมงานหลัก<\u002Fb> → ใช้ dropdown <b>“＋ เพิ่มคนเข้าทีม”<\u002Fb> เลือกได้ทุกคนในระบบ (จัดกลุ่มตามตำแหน่ง) · กด <b>✕<\u002Fb> บนชื่อเพื่อเอาออก<\u002Fp>\n  <div style=\"background:#F4F0E7;border:1px solid #E7DFCE;border-radius:10px;padding:12px 15px;margin-bottom:14px;break-inside:avoid;font-size:10pt\">\n    <b>สำคัญ:<\u002Fb> คนที่ถูกใส่ในทีมโครงการจะ<b>ได้สิทธิ์เห็นโครงการนั้นทันที<\u002Fb> ไม่ต้องไปตั้งค่าที่หน้าบุคลากรอีก — และการ์ดทีมทั้งบนหัวโครงการกับทีมงานหลักจะอัปเดตตรงกันเสมอ\n  <\u002Fdiv>\n  <p style=\"margin:0 0 16px\">ลำดับการแสดง: <b>PM → Design Manager → Site Manager → Designer → คนอื่นๆ<\u002Fb> · ป้ายตำแหน่งแสดงตำแหน่งจริงของแต่ละคนเสมอ<\u002Fp>\n\n  <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:19pt;color:#1C1B18;margin:24px 0 4px;border-bottom:2px solid #C9A961;padding-bottom:6px\">6 · หน้าบุคลากร &amp; สิทธิ์ <span style=\"font-family:'IBM Plex Sans Thai';font-size:9.5pt;color:#A29B8C;font-weight:400\">— Super Admin<\u002Fspan><\u002Fh2>\n\n  <p style=\"margin:12px 0 10px\">มี 3 แท็บ: <b>ผู้ใช้ &amp; สิทธิ์<\u002Fb> (มุมมองตารางแบบ Excel หรือการ์ด) · <b>ตำแหน่งงาน<\u002Fb> (ตำแหน่ง = สิทธิ์ + JD ในข้อมูลเดียว) · <b>Sheet โครงการ<\u002Fb><\u002Fp>\n  <p style=\"margin:0 0 12px\">เพิ่มผู้ใช้ใหม่: กด <b>＋ เพิ่มผู้ใช้<\u002Fb> → แก้ชื่อ ชื่อผู้ใช้ อีเมล ตำแหน่ง ในแถวใหม่ → มอบหมายโครงการ · อีเมลที่ยังเป็นรหัสพนักงานจะไฮไลต์<span style=\"background:#FFF1A8;padding:1px 5px;border-radius:3px\">พื้นเหลือง<\u002Fspan><\u002Fp>\n\n  <h3 style=\"font-size:12pt;font-weight:700;color:#8A6D3B;margin:18px 0 6px\">เครื่องมือขั้นสูง — ใช้เมื่อจำเป็นเท่านั้น<\u002Fh3>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:9.5pt;margin:8px 0 14px\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"text-align:left;background:#F1EDE2;border:1px solid #DED7C8;padding:7px 10px;font-size:8.5pt;color:#6E695E;width:34%\">ปุ่ม<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left;background:#F1EDE2;border:1px solid #DED7C8;padding:7px 10px;font-size:8.5pt;color:#6E695E\">ผลลัพธ์<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">สำรองข้อมูลทั้งระบบ (ไฟล์)<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">ดาวน์โหลดข้อมูลทั้งหมดเป็นไฟล์ — <b>ปลอดภัย ควรทำสัปดาห์ละครั้ง<\u002Fb><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">ดึงข้อมูลจากเซิร์ฟเวอร์ใหม่<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">ทิ้งข้อมูลค้างในเครื่อง โหลดชุดล่าสุดมาแทน<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">โหลดรายชื่อจากฐานพนักงาน<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">สร้างการ์ดผู้ใช้ใหม่จากทะเบียนพนักงาน (ข้อมูลที่แก้ไว้ยังอยู่)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">นำเข้าไฟล์สำรอง<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">⚠ กู้ข้อมูลจากไฟล์ — ทับข้อมูลปัจจุบัน<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px;background:#FDF6F4\">อัปโหลดทับเซิร์ฟเวอร์ทั้งระบบ<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px;background:#FDF6F4\">🔴 <b>อันตรายสุด<\u002Fb> — ถ้าเครื่องนี้ข้อมูลเก่า จะทับงานของทุกคน ปกติไม่ต้องใช้<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">ล้างข้อมูลในเครื่องนี้<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 10px\">ลบ cache เครื่องนี้ — ข้อมูลบนเซิร์ฟเวอร์ไม่ถูกแตะ<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:19pt;color:#1C1B18;margin:24px 0 4px;border-bottom:2px solid #C9A961;padding-bottom:6px\">7 · ระบบความปลอดภัย<\u002Fh2>\n\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 16px\">\n    <div style=\"background:#FBF9F4;border:1px solid #E7E1D3;border-radius:11px;padding:13px 15px;break-inside:avoid\">\n      <div style=\"font-weight:700;color:#8A2E1E;font-size:10.5pt;margin-bottom:4px\">⏻ พักระบบฉุกเฉิน<\u002Fdiv>\n      <div style=\"font-size:9.5pt;line-height:1.6\">Super Admin กดหนึ่งครั้ง → ทุกเครื่องทั่วบริษัทเข้าโหมด<b>ดูได้อย่างเดียว<\u002Fb> ภายใน 25 วินาที ใช้เมื่อพบข้อมูลเพี้ยนหรือกำลังกู้ข้อมูล · กดอีกครั้งเปิดกลับ<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FBF9F4;border:1px solid #E7E1D3;border-radius:11px;padding:13px 15px;break-inside:avoid\">\n      <div style=\"font-weight:700;color:#8A6D3B;font-size:10.5pt;margin-bottom:4px\">📢 ประกาศถึงทุกคน<\u002Fdiv>\n      <div style=\"font-size:9.5pt;line-height:1.6\">พิมพ์ข้อความ → เด้ง popup ทุกเครื่อง เลือกระดับ <b>ด่วน 🚨<\u002Fb> (หัวแดง) หรือ <b>ทั่วไป 📢<\u002Fb> · ผู้ใช้กดรับทราบแล้วไม่เด้งซ้ำ<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FBF9F4;border:1px solid #E7E1D3;border-radius:11px;padding:13px 15px;break-inside:avoid\">\n      <div style=\"font-weight:700;color:#2E5A3C;font-size:10.5pt;margin-bottom:4px\">🛡 ยามเฝ้าระบบ<\u002Fdiv>\n      <div style=\"font-size:9.5pt;line-height:1.6\">สแกนหาข้อมูลชนกันอัตโนมัติทุกครั้งที่ซิงก์ (อีเมล/ชื่อผู้ใช้ซ้ำ, ทีมอ้างคนที่ไม่มีจริง) — เจอแล้วซ่อมให้เอง หรือเตือนเป็นแถบแดงถ้าต้องตัดสินใจ<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#FBF9F4;border:1px solid #E7E1D3;border-radius:11px;padding:13px 15px;break-inside:avoid\">\n      <div style=\"font-weight:700;color:#2A5A7A;font-size:10.5pt;margin-bottom:4px\">💾 สำรองอัตโนมัติ<\u002Fdiv>\n      <div style=\"font-size:9.5pt;line-height:1.6\">ระบบสำรองรายชื่อผู้ใช้และโครงการขึ้นเซิร์ฟเวอร์<b>วันละครั้ง เก็บย้อนหลัง 7 วัน<\u002Fb> · Log เข้า-ออกระบบเก็บ 30 วัน<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#F4F0E7;border:1px solid #E7DFCE;border-radius:10px;padding:12px 15px;margin-bottom:16px;break-inside:avoid;font-size:10pt\">\n    <b>ล็อกเวอร์ชัน:<\u002Fb> ถ้าเครื่องไหนเปิดแอปเวอร์ชันเก่าค้างไว้ ระบบจะล็อกให้<b>ดูได้อย่างเดียว<\u002Fb> อัตโนมัติ พร้อมแถบเตือนให้รีเฟรช — เพื่อไม่ให้ข้อมูลเก่าไปทับข้อมูลใหม่ของเพื่อนร่วมงาน<br>\n    <span style=\"color:#6E695E\">วิธีรีเฟรช: คอมพิวเตอร์กด <b>Ctrl + Shift + R<\u002Fb> · มือถือปิดแล้วเปิดแอปใหม่<\u002Fspan>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:'Cormorant Garamond',serif;font-size:19pt;color:#1C1B18;margin:24px 0 4px;border-bottom:2px solid #C9A961;padding-bottom:6px\">8 · ปัญหาที่พบบ่อย<\u002Fh2>\n\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:10pt;margin:14px 0 16px\">\n    <sc-raw-thead>\n      <sc-raw-tr>\n        <sc-raw-th style=\"text-align:left;background:#F1EDE2;border:1px solid #DED7C8;padding:8px 11px;font-size:9pt;color:#6E695E;width:38%\">อาการ<\u002Fsc-raw-th>\n        <sc-raw-th style=\"text-align:left;background:#F1EDE2;border:1px solid #DED7C8;padding:8px 11px;font-size:9pt;color:#6E695E\">วิธีแก้<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ล็อกอินไม่ได้ — “ไม่พบชื่อผู้ใช้นี้”<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">พิมพ์ชื่อผู้ใช้ภาษาอังกฤษให้ตรง ไม่มีเว้นวรรค · ยังไม่ได้แจ้ง Super Admin<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ไม่เห็นโครงการที่ควรเห็น<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ยังไม่ถูกใส่ในทีมโครงการ — แจ้งผู้จัดการฝ่ายให้เพิ่มในการ์ดทีมงานหลัก<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ข้อมูลไม่ตรงกับเครื่องอื่น<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">รีเฟรชหน้า (Ctrl+Shift+R) — ถ้ายังไม่ตรง แจ้ง Super Admin กด “ดึงข้อมูลจากเซิร์ฟเวอร์ใหม่”<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">แก้แล้วไม่บันทึก<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">เช็คว่ามีแถบเตือนด้านบนไหม (ระบบถูกพัก หรือแอปเวอร์ชันเก่า) → รีเฟรช<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">รูปโปรไฟล์หาย<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">อัปโหลดใหม่จากเมนูผู้ใช้ — ระบบจะซิงก์ให้ทุกเครื่องเอง<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">อัปโหลดไฟล์ไม่ขึ้น<\u002Fsc-raw-td><sc-raw-td style=\"border:1px solid #E7E1D3;padding:7px 11px\">ไฟล์ใหญ่เกินไป — ย่อขนาดหรือแปลงเป็น PDF ก่อน<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <div style=\"background:#1C1B18;color:#F4EFE6;border-radius:12px;padding:18px 22px;break-inside:avoid\">\n    <div style=\"font-size:9pt;letter-spacing:.16em;color:#C9A961;font-weight:600;margin-bottom:6px\">ต้องการความช่วยเหลือ<\u002Fdiv>\n    <div style=\"font-size:10.5pt;line-height:1.7\">แจ้งปัญหาหรือขอสิทธิ์เพิ่ม → ติดต่อ <b>Super Admin<\u002Fb> (ผู้จัดทำเอกสาร) · ปัญหาเร่งด่วนที่กระทบทั้งระบบ ให้แจ้งทันทีเพื่อพักระบบก่อนข้อมูลเสียหายลุกลาม<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
