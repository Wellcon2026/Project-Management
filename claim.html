<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1B18">
<title>Claim · เคลมความเสียหาย · Wellcon PM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE6; --card:#FFFDF8; --line:#E4DED2; --line2:#ECE6DA; --ink:#1C1B18; --ink2:#4A4840; --mut:#8C877D;
  --gold:#C9A961; --goldD:#8A6D3B; --goldT:#F6EEDC; --red:#C4442E; --redT:#FDECEC; --green:#2E7D46; --greenT:#E7F3EA;
  --blue:#2A7DA3; --blueT:#E1EEF4; --amber:#C2681E; --amberT:#FBEEDF;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.stg{background:#F4D35E;color:#3A2F00;font-size:12px;text-align:center;padding:2px 8px;font-weight:600}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--ink);color:#F4EFE6;padding:calc(var(--safe-t) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.hdr .back{width:42px;height:42px;border-radius:12px;border:1px solid #3A3832;background:#2C2A25;color:#F4EFE6;display:flex;align-items:center;justify-content:center;flex:none;font-size:20px}
.hdr .tt{display:flex;flex-direction:column;line-height:1.25;min-width:0;flex:1}
.hdr .tt b{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .tt span{font-size:12px;color:#C9BFA9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hb{min-height:40px;border-radius:12px;border:1px solid #3A3832;background:#2C2A25;color:#E2BC66;padding:0 12px;font-size:13px;font-weight:600;flex:none}
main{max-width:1100px;margin:0 auto;padding:14px 14px calc(110px + var(--safe-b))}
/* summary */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:12px 14px}
.kpi b{display:block;font-size:20px;font-weight:700;line-height:1.2;white-space:nowrap}
.kpi span{font-size:12.5px;color:var(--mut)}
.kpi.g b{color:var(--green)} .kpi.a b{color:var(--amber)} .kpi.r b{color:var(--red)} .kpi.bl b{color:var(--blue)}
.bar{height:10px;border-radius:99px;background:#EFE8DB;overflow:hidden;display:flex;margin-top:8px}
.bar i{display:block;height:100%}
.sec{font-size:13px;font-weight:700;color:var(--ink2);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sec .ln{flex:1;height:1px;background:var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scrollx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.scrollx .chip{flex:none}
.chip{min-height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 13px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip b{font-weight:700;opacity:.7}
.inp{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:9px 12px;font-size:15px}
textarea.inp{min-height:80px;resize:vertical}
.inp:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.lbl{font-size:12.5px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
.lbl .hint{font-weight:400;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){ .g3{grid-template-columns:1fr 1fr} }
.card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px}
/* claim list */
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.cc{background:var(--card);border:1px solid var(--line2);border-left:5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.cc:active{transform:scale(.995)}
.cc .r1{display:flex;align-items:center;gap:8px}
.cc .no{font-size:12px;font-weight:700;color:var(--goldD);background:var(--goldT);border-radius:8px;padding:2px 8px;white-space:nowrap}
.cc .tt{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .r2{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut);align-items:center}
.cc .money{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.cc .money b{font-weight:700}
.cc .warn{font-size:12.5px;font-weight:600;color:var(--red);background:var(--redT);border-radius:8px;padding:4px 8px}
.cc .ph{display:flex;gap:4px}
.cc .ph img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.pill{border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:34px 10px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-b));z-index:30;min-height:56px;border-radius:999px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:15px;padding:0 20px;box-shadow:0 8px 24px rgba(196,68,46,.35)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
@media (max-width:899px){ .sheet{inset:0} }
@media (min-width:900px){ .sheet{top:0;right:0;bottom:0;width:min(760px,100vw);box-shadow:-10px 0 40px rgba(0,0,0,.2)} }
.sh-h{position:sticky;top:0;z-index:5;background:var(--ink);color:#F4EFE6;padding:calc(var(--safe-t) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
.sh-h .x{width:42px;height:42px;border-radius:12px;border:1px solid #3A3832;background:#2C2A25;color:#fff;font-size:20px;flex:none}
.sh-h .tt{flex:1;min-width:0;line-height:1.25}
.sh-h .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-h .tt span{font-size:12px;color:#C9BFA9}
.sh-h .sv{font-size:12px;color:#C9BFA9;white-space:nowrap}
.sh-b{padding:12px 14px calc(120px + var(--safe-b));max-width:760px;margin:0 auto}
.blk{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:6px 14px 14px;margin-top:12px}
.blk h3{margin:10px 0 0;font-size:15px;display:flex;align-items:center;gap:8px}
.blk h3 .n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.blk h3 small{font-weight:500;color:var(--mut);font-size:12px}
/* photos */
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:6px}
.pic{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#EFE8DB;border:1px solid var(--line)}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic .del{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(196,68,46,.9);color:#fff;font-size:15px;line-height:1}
.pic.add{border:1.5px dashed #C9BFA9;background:#FBF8F2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12.5px;color:var(--goldD);font-weight:600;cursor:pointer}
.pic.add i{font-style:normal;font-size:22px}
.pic.add input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.pic.busy{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
/* cost lines */
.ln-tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cl{border:1px solid var(--line2);border-radius:12px;padding:10px;margin-top:8px;background:#fff}
.cl .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cl .ty{font-size:12px;font-weight:700;border-radius:8px;padding:2px 8px}
.ty-lab{background:var(--blueT);color:var(--blue)} .ty-mat{background:var(--amberT);color:var(--amber)} .ty-oth{background:#EFE8DB;color:var(--goldD)}
.cl .sum{margin-left:auto;font-weight:700;white-space:nowrap}
.cl .rm{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--red);flex:none}
.cl .row{display:grid;gap:8px}
.cl .row.lab{grid-template-columns:2fr 1fr 1fr 1.3fr}
.cl .row.mat{grid-template-columns:2fr 1fr 1fr 1.3fr}
.cl .row.oth{grid-template-columns:3fr 1.3fr}
@media (max-width:560px){ .cl .row.lab,.cl .row.mat{grid-template-columns:1fr 1fr} }
.cl .row label{display:flex;flex-direction:column;font-size:11.5px;color:var(--mut);gap:3px}
.cl .row .inp{min-height:40px;padding:7px 9px;font-size:14px}
.tot{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:4px;font-size:14px}
.tot div{display:flex;justify-content:space-between;gap:10px}
.tot .big{font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.tot .mut{color:var(--mut);font-size:12.5px}
.pct{display:flex;align-items:center;gap:6px}
.pct .inp{width:84px;min-height:36px;padding:5px 8px;text-align:right}
/* status stepper */
.steps{display:flex;gap:4px;overflow-x:auto;padding:4px 0 2px}
.stp{flex:1;min-width:50px;text-align:center;font-size:11.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:4px}
.stp i{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700;background:#fff}
.stp.done i{background:var(--green);border-color:var(--green);color:#fff}
.stp.cur i{background:var(--ink);border-color:var(--ink);color:#fff}
.stp.cur{color:var(--ink);font-weight:700}
.stp.rej i{background:var(--red);border-color:var(--red);color:#fff}
.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{min-height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;padding:0 14px;font-size:14px}
.btn.pri{border:0;background:var(--ink);color:#fff}
.btn.ok{border:0;background:var(--green);color:#fff}
.btn.del{color:var(--red);border-color:#E8A898}
.btn.gold{border:0;background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.45}
.stage{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;margin-top:8px;background:#fff}
.stage h4{margin:0 0 4px;font-size:13.5px;display:flex;align-items:center;gap:8px}
.stage.off{opacity:.55}
.info{background:#EFE8DB;border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ink2);margin-top:8px}
.warnbox{background:var(--redT);border-radius:12px;padding:10px 12px;font-size:13px;color:#8E2F1F;margin-top:8px;font-weight:500}
.okbox{background:var(--greenT);border-radius:12px;padding:10px 12px;font-size:13px;color:#245E3A;margin-top:8px}
.log{margin-top:8px;font-size:12.5px;color:var(--ink2);display:grid;gap:6px}
.log div{border-left:3px solid var(--line);padding-left:8px}
.log span{color:var(--mut)}
.bot{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;padding:10px 14px calc(10px + var(--safe-b));background:linear-gradient(to top,var(--bg) 80%,rgba(244,239,230,0));max-width:760px;margin:0 auto}
.bot .btn{min-height:52px;font-size:15px}
.grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);z-index:100;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:40px auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.rates{display:grid;gap:8px}
.rates .rr{display:grid;grid-template-columns:2fr 1.2fr 34px;gap:8px;align-items:center}
.ver{color:var(--mut);font-size:12px;text-align:center;margin-top:24px}
.lb{position:fixed;inset:0;z-index:90;background:rgba(10,10,10,.92);display:flex;align-items:center;justify-content:center;padding:20px}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
.msg{max-width:520px;margin:40px auto;padding:0 14px}
/* v1.370 แบบประกอบ */
.pl-req{display:flex;flex-direction:column;gap:6px;padding:14px;border:2px dashed #E8A898;border-radius:14px;background:#FDF4F1}
.pl-req b{font-size:14.5px;color:#A4361F}.pl-req small{font-size:12.5px;color:#8C877D}
.pl-req.busy{flex-direction:row;align-items:center;gap:10px;border-color:#E4DED2;background:#fff;font-weight:600}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.row2 .btn{font-size:13px}
.pl-has{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:640px){ .pl-has{grid-template-columns:1fr} }
.plt{position:relative;display:block;width:100%;padding:0;border:1px solid #E4DED2;border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}
.plt img{display:block;width:100%;height:auto}
.pl-inf b{display:block;font-size:14px}.pl-inf small{display:block;font-size:12.5px;color:#8C877D;margin-top:2px}
.pe-ov{position:absolute;inset:0;pointer-events:none}
.pe-box{position:absolute;border:2.5px solid #E03131;background:rgba(224,49,49,.08);border-radius:3px}
.pe-pin{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#E03131;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pe-pin.sm{width:18px;height:18px;font-size:10px;border-width:1.5px}
#plan-ed{position:fixed;inset:0;z-index:120;background:#141311;color:#fff;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
.pe-top{display:flex;align-items:center;gap:10px}
.pe-top .btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}.pe-top .btn.pri{background:#2E7D46;border-color:#2E7D46}.pe-top b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pe-top .grow{flex:1}
.pe-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pe-bar button{min-height:40px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.pe-bar button.on{background:#E03131;border-color:#E03131}.pe-bar .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.2)}
.pe-wrap{flex:1;min-height:0;overflow:auto;border-radius:12px;background:#E9E6DE}
.pe-st{position:relative;width:100%;user-select:none;-webkit-user-select:none}
.pe-st img{display:block;width:100%;height:auto;pointer-events:none}
.pe-hint{text-align:center;font-size:12px;color:rgba(255,255,255,.65)}
.apst.no{background:#FDECEC;color:#C4442E}
.pdfpk{position:fixed;inset:0;z-index:130;background:rgba(10,10,20,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.pdfpk-box{width:min(980px,100%);max-height:100%;display:flex;flex-direction:column;background:#fff;color:#1C1B18;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.pdfpk-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #EEE9DE}
.pdfpk-h b{display:block;font-size:16px}.pdfpk-h span{font-size:12.5px;color:#6E695E}
.pdfpk-h button{margin-left:auto;width:38px;height:38px;border-radius:50%;border:0;background:#F2EDE3;font-size:20px;cursor:pointer}
.pdfpk-sc{overflow:auto;padding-bottom:12px}
.pdfpk-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:12px 16px;overflow:auto}
.pdfpk-i{display:flex;flex-direction:column;gap:6px;border:2px solid #E4DED2;border-radius:12px;background:#FBFAF6;padding:6px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:#1C1B18;text-align:left}
.pdfpk-i:hover{border-color:#C9A961}
.pdfpk-t{aspect-ratio:1.414;display:grid;place-items:center;background:#fff;border-radius:8px;overflow:hidden;color:#B4AE9F}
.pdfpk-t img{width:100%;height:100%;object-fit:contain}
.pk-sec{padding:12px 16px 0;font-size:13px;font-weight:700;color:#6E695E}.pk-hit{color:#A4520F}
.pk-dw{display:flex;flex-direction:column;gap:6px;padding:8px 16px 0}
.pk-d{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border:1px solid #E4DED2;border-radius:12px;background:#fff;font:inherit;color:#1C1B18;text-align:left}
.pk-th{width:96px;height:68px;object-fit:cover;border-radius:8px;border:1px solid #E4DED2;flex:none;background:#F6F3EC}
.pk-tx{flex:1;min-width:0;display:block}
.pk-fs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pk-f{min-height:36px;padding:0 12px;border-radius:9px;border:1px solid #D8D2C4;background:#FBF8F1;font:inherit;font-size:12.5px;font-weight:700;color:#1C1B18;cursor:pointer}
.pk-f.pdf{border-color:#E8A898;background:#FDF1EE;color:#A4361F}.pk-f.img{border-color:#B9D6C2;background:#EEF7F1;color:#2E5E3E}
.pk-f:hover{filter:brightness(.96)}
.pdfpk-h .pk-back{margin-left:0;width:auto;height:auto;min-height:38px;padding:0 12px;border-radius:10px;border:1px solid #E4DED2;background:#fff;font:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;flex:none}
.pk-load{grid-column:1/-1;padding:24px;text-align:center;color:#8C877D}
.pk-d.hit{border-color:#C9A961;background:#FBF4E6}
.pk-d i{font-style:normal;font-weight:800;font-size:11px;min-width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:#C4442E;color:#fff}
.pk-d b{display:block;font-size:13.5px}.pk-d small{display:block;font-size:12px;color:#8C877D}
.ap{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ap-r{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line,#E4DED2);border-radius:14px;background:#fff}
.ap-r>i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#F2EDE3;font-size:16px;flex:none}
.ap-r.ok{border-color:#B9D9C2;background:#F1F8F3}.ap-r.ok>i{background:#2E7D46;color:#fff;font-weight:700}
.ap-t{flex:1;min-width:0}.ap-t b{display:block;font-size:14px}.ap-t small{display:block;font-size:12px;color:#8C877D}
.ap-w{font-size:12px;color:#8C877D;white-space:nowrap}
.ap-r .btn:disabled{opacity:.5}
.ap-ok{padding:10px 12px;border-radius:12px;background:#E7F3EA;color:#1F6B3A;font-weight:600;font-size:13.5px}
.apst{display:inline-block;margin:2px 0 4px;padding:2px 10px;border-radius:999px;background:#F2EDE3;color:#6E695E;font-size:12px;font-weight:700}
.apst.ok{background:#E7F3EA;color:#1F6B3A}.apst.me{background:#FBEEDF;color:#A4520F}
.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px;margin-bottom:4px}
