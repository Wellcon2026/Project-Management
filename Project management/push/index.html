  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 99 gTxt }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isGold }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px 18px 26px;display:flex;flex-direction:column;gap:14px;animation:riseIn .28s ease both\">\n            <div>\n              <div style=\"font:600 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8c491a\">สมาคมค้าทองคำ · 96.5%<\u002Fdiv>\n              <h4 style=\"margin:6px 0 0;font-size:26px;font-family:'Caprasimo','Noto Sans Thai',sans-serif\">ราคาทองวันนี้<\u002Fh4>\n              <div style=\"font-size:12px;color:#82796a;margin-top:2px\">ประจำวันที่ {{ today }} เวลา {{ clock }} (ครั้งที่ {{ gold.updates }})<\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ goldRows }}\" as=\"g\" hint-placeholder-count=\"2\">\n              <div style=\"border-radius:24px;border:1px solid rgba(32,30,29,.1);background:#faf3e6;padding:16px 16px 14px;box-shadow:0 3px 10px rgba(46,43,37,.08)\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                  <div class=\"nw\" style=\"font-size:15px;font-weight:700\">{{ g.label }}<\u002Fdiv>\n                  <div style=\"font-size:11px;font-weight:600;color:#8c491a;background:#ffe1d0;border-radius:999px;padding:4px 10px\">{{ g.unit }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px\">\n                  <div style=\"background:#f0fae1;border-radius:18px;padding:11px 12px\">\n                    <div style=\"font-size:11px;color:#56633f;font-weight:600\">{{ g.buyLabel }}<\u002Fdiv>\n                    <div style=\"font-family:'Caprasimo',sans-serif;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums\">{{ g.buy }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background:#ffe1d0;border-radius:18px;padding:11px 12px\">\n                    <div style=\"font-size:11px;color:#8c491a;font-weight:600\">ขายออก<\u002Fdiv>\n                    <div style=\"font-family:'Caprasimo',sans-serif;font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums\">{{ g.sell }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-top:11px;font-size:11.5px;color:#645c50\">\n                  <span class=\"nw\">ส่วนต่าง {{ g.spread }}<\u002Fspan>\n                  <span class=\"nw\" style=\"font-weight:600;color:{{ gold.chgColor }}\">{{ gold.chgTxtPlain }} จากเมื่อวาน<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"border-radius:24px;background:#ebddc5;padding:15px 16px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"font-size:13px;font-weight:700\">เตือนเมื่อราคาถึง<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n                <sc-for list=\"{{ alerts }}\" as=\"a\" hint-placeholder-count=\"3\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ a.toggle }}\" style=\"{{ a.style }}\" style-active=\"transform:scale(.96)\">{{ a.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;color:#645c50\">{{ alertNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isFlip }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px 18px 26px;display:flex;flex-direction:column;gap:15px;animation:riseIn .28s ease both\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div>\n                <div class=\ size:10.5px\">เงินจมอยู่<\u002Fdiv><div class=\"nw\" style=\"font-weight:700\">{{ flip.capital }}<\u002Fdiv><\u002Fdiv>\n                  <div><div class=\"nw\" style=\"opacity:.8;font-size:10.5px\">กำไรคาดการณ์<\u002Fdiv><div class=\"nw\" style=\"font-weight:700\">{{ flip.expected }}<\u002Fdiv><\u002Fdiv>\n                  <div><div class=\"nw\" style=\"opacity:.8;font-size:10.5px\">มาร์จินเฉลี่ย<\u002Fdiv><div class=\"nw\" style=\"font-weight:700\">{{ flip.avgMargin }}<\u002Fdiv><\u002Fdiv>\n                  <div><div class=\"nw\" style=\"opacity:.8;font-size:10.5px\">เวลาเฉลี่ยต่อหลัง<\u002Fdiv><div class=\"nw\" style=\"font-weight:700\">{{ flip.avgDays }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ flip.hasUnpriced }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-radius:18px;background:#f3e0d6;border:1px solid rgba(166,60,38,.22);padding:11px 14px;font-size:11.5px;color:#8c491a;line-height:1.5\">{{ flip.unpricedTxt }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;gap:7px\">\n              <sc-for list=\"{{ flip.filters }}\" as=\"ft\" hint-placeholder-count=\"2\">\n                <button type=\"button\" sc-camel-on-click=\"{{ ft.pick }}\" style=\"{{ ft.style }}\" style-active=\"transform:scale(.97)\">{{ ft.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ flip.empty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-radius:22px;background:#faf3e6;border:1px dashed rgba(32,30,29,.2);padding:22px 18px;text-align:center;font-size:12px;color:#645c50;line-height:1.6\">ยังไม่มีโครงการในหมวดนี้ — กด “+ เพิ่ม” เพื่อบันทึกบ้านหลังใหม่ ตั้งแต่ราคาซื้อ งบรีโนเวท ไปจนถึงราคาที่ตั้งขาย<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;flex-direction:column;gap:11px\">\n              <sc-for list=\"{{ flip.rows }}\" as=\"fp\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ fp.edit }}\" style=\"width:100%;text-align:left;border-radius:24px;background:#faf3e6;border:1px solid rgba(32,30,29,.1);padding:15px 16px;display:flex;flex-direction:column;gap:12px;font:inherit;color:inherit;cursor:pointer\" style-hover=\"background:#fff8ec;border-color:rgba(198,113,57,.4)\" style-active=\"transform:scale(.995)\">\n                  <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%\">\n                    <div style=\"min-width:0\">\n                      <div style=\"font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ fp.name }}<\u002Fdiv>\n                      <div class=\"nw\" style=\"font-size:10.5px;color:#82796a;margin-top:3px\">{{ fp.days }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"{{ fp.stageStyle }}\">{{ fp.stage }}<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:10px;width:100%\">\n                    <div>\n                      <div class=\"nw\" style=\"font-size:10.5px;color:#82796a\">{{ fp.marginLabel }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:baseline;gap:8px\">\n                        <span class=\"nw\" style=\"font-family:'Caprasimo','Noto Sans Thai',sans-serif;font-size:25px;line-height:1.15;font-variant-numeric:tabular-nums;color:{{ fp.profitColor }}\">{{ fp.profit }}<\u002Fspan>\n                        <span class=\"nw\" style=\"font-size:12.5px;font-weight:700;color:{{ fp.profitColor }}\">{{ fp.margin }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right\">\n                      <div class=\"nw\" style=\"font-size:10.5px;color:#82796a\">{{ fp.exitLabel }}<\u002Fdiv>\n                      <div class=\"nw\" style=\"font-size:15px;font-weight:700;font-variant-numeric:tabular-nums\">{{ fp.exit }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"width:100%\">\n                    <div style=\"height:7px;border-radius:999px;background:rgba(32,30,29,.09);overflow:hidden\"><div style=\"{{ fp.barStyle }}\"><\u002Fdiv><\u002Fdiv>\n                    <div class=\"nw\" style=\"font-size:10.5px;color:#82796a;margin-top:5px\">ต้นทุนรวม {{ fp.cost }} · ผลตอบแทน {{ fp.annual }}<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <sc-if value=\"{{ fp.needsPrice }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"width:100%;border-radius:14px;background:#f3e0d6;padding:9px 12px;font-size:11px;color:#8c491a;line-height:1.4\">แตะเพื่อกรอกราคาที่ขายได้จริง แล้วกำไรจะย้ายไปอยู่ในยอดที่รับรู้แล้ว<\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%\">\n                    <div style=\"border-radius:14px;background:#ebddc5;padding:9px 10px\"><div class=\"nw\" style=\"font-size:10px;color:#645c50\">ราคาซื้อ<\u002Fdiv><div class=\"nw\" style=\"font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums\">{{ fp.buy }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"border-radius:14px;background:#ebddc5;padding:9px 10px\"><div class=\"nw\" style=\"font-size:10px;color:#645c50\">รีโนเวท<\u002Fdiv><div class=\"nw\" style=\"font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums\">{{ fp.reno }}<\u002Fdiv><\u002Fdiv>\n                    <div style=\"border-radius:14px;background:#ebddc5;padding:9px 10px\"><div class=\"nw\" style=\"font-size:10px;color:#645c50\">ค่าถือครอง<\u002Fdiv><div class=\"nw\" style=\"font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums\">{{ fp.hold }}<\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"font-size:10.5px;color:#82796a;line-height:1.5;text-align:center\">ค่าถือครองรวมดอกเบี้ย ภาษี ค่านายหน้า และค่าส่วนกลางระหว่างถือ — ใส่ให้ครบเพื่อให้มาร์จินสะท้อนความจริง<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isHealth }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px 18px 26px;display:flex;flex-direction:column;gap:15px;animation:riseIn .28s ease both\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div>\n                <div class=\"nw\" style=\"font:600 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8c491a\">บันทึกส่วนตัว<\u002Fdiv>\n                <h4 style=\"margin:6px 0 0;font-size:25px;font-family:'Caprasimo','Noto Sans Thai',sans-serif\">ประวัติสุขภาพ<\u002Fh4>\n                <div style=\"font-size:11.5px;color:#645c50;margin-top:4px\">ผลตรวจ {{ health.count }} ครั้ง · เจ็บป่วย {{ ill.count }} ครั้ง<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:4px;background:#ebddc5;border-radius:999px;padding:4px\">\n              <sc-for list=\"{{ hv.tabs }}\" as=\"ht\" hint-placeholder-count=\"3\">\n                <button type=\"button\" sc-camel-on-click=\"{{ ht.go }}\" style=\"{{ ht.style }}\" style-active=\"transform:scale(.96)\">{{ ht.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"border-radius:22px;border:1px solid rgba(32,30,29,.1);background:#faf3e6;padding:15px 16px;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                <span class=\"nw\" style=\"font-size:13px;font-weight:700\">ข้อมูลสุขภาพพื้นฐาน<\u002Fspan>\n                <button type=\"button\" sc-camel-on-click=\"{{ prof.open }}\" class=\"nw\" style=\"padding:7px 13px;border:1px solid rgba(198,113,57,.4);border-radius:999px;background:transparent;color:#8c491a;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(198,113,57,.1)\">แก้ไข<\u002Fbutton>\n              <\u002Fdiv>\n              <sc-if value=\"{{ prof.hasAny }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:7px\">\n                  <sc-for list=\"{{ prof.rows }}\" as=\"pr\" hint-placeholder-count=\"2\">\n                    <div style=\"display:flex;justify-content:space-between;gap:12px;font-size:12px\">\n                      <span class=\"nw\" style=\"color:#645c50\">{{ pr.label }}<\u002Fspan>\n                      <span style=\"font-weight:700;text-align:right\">{{ pr.value }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ prof.none }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-size:11.5px;color:#645c50;line-height:1.55\">ยังไม่ได้กรอก — โรคประจำตัว ประวัติแพ้ยา และยาที่ใช้ประจำ ช่วยให้คำตอบจากผู้ช่วยแม่นขึ้นมาก<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ prof.warnAllergy }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"border-radius:14px;background:#f3e0d6;border:1px solid rgba(198,47,28,.2);padding:10px 13px;font-size:11px;color:#8c491a;line-height:1.5\">ยังไม่ได้ระบุประวัติแพ้ยา — ควรกรอกไว้ แม้จะเป็น “ไม่มี” ก็ตาม<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ bmi.has }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-radius:22px;border:1px solid rgba(32,30,29,.1);background:#faf3e6;padding:16px 17px;display:flex;flex-direction:column;gap:13px\">\n                <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:12px\">\n                  <div>\n                    <div class=\"nw\" style=\"font-size:11px;color:#645c50;font-weight:600\">ดัชนีมวลกาย (BMI)<\u002Fdiv>\n                    <div style=\"display:flex;align-items:baseline;gap:9px;margin-top:3px\">\n                      <span style=\"{{ bmi.numStyle }}\">{{ bmi.num }}<\u002Fspan>\n                      <span style=\"{{ bmi.badgeStyle }}\">{{ bmi.band }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div class=\"nw\" style=\"font-size:10.5px;color:#82796a;text-align:right;line-height:1.5\">{{ bmi.basis }}<\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,#c99a6a 0%,#c99a6a 14%,#1c8f4a 20%,#1c8f4a 37%,#d99a3c 42.5%,#d99a3c 47.5%,#c62f1c 52.5%,#c62f1c 100%)\">\n                  <div style=\"{{ bmi.markStyle }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"position:relative;height:11px\">\n                  <sc-for list=\"{{ bmi.ticks }}\" as=\"tk\" hint-placeholder-count=\"4\">\n                    <span style=\"{{ tk.style }}\">{{ tk.label }}<\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"{{ bmi.headStyle }}\">{{ bmi.headline }}<\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n                  <div style=\"display:flex;gap:9px;align-items:flex-start\">\n                    <span style=\"flex:none;margin-top:1px;width:18px;height:18px;border-radius:50%;background:#e1eecc;color:#3f5127;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700\">+<\u002Fspan>\n                    <span style=\"font-size:11.5px;line-height:1.6;color:#3f4a33\">{{ bmi.good }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:9px;align-items:flex-start\">\n                    <span style=\"flex:none;margin-top:1px;width:18px;height:18px;border-radius:50%;background:#f3e0d6;color:#8c491a;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700\">!<\u002Fspan>\n                    <span style=\"font-size:11.5px;line-height:1.6;color:#645c50\">{{ bmi.risk }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"border-radius:16px;background:#f5ead8;padding:11px 13px;display:flex;flex-direction:column;gap:4px\">\n                  <span class=\"nw\" style=\"font:600 9.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8c491a\">คำแนะนำ<\u002Fspan>\n                  <span style=\"font-size:11.5px;line-height:1.6\">{{ bmi.action }}<\u002Fspan>\n                  <sc-if value=\"{{ bmi.hasTarget }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"font-size:11.5px;font-weight:700;color:#8c491a\">{{ bmi.targetText }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ bmi.none }}\" hint-placeholder-val=\"{{ true }}\">\n              <button type=\"button\" sc-camel-on-click=\"{{ prof.open }}\" style=\"width:100%;text-align:left;border-radius:22px;border:1px dashed rgba(32,30,29,.2);background:#faf3e6;padding:14px 16px;font:inherit;color:#645c50;font-size:11.5px;line-height:1.55;cursor:pointer\" style-hover=\"border-color:rgba(198,113,57,.5);background:#fff8ec\">กรอกส่วนสูงและน้ำหนักเพื่อคำนวณ BMI — แตะเพื่อกรอก<\u002Fbutton>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hv.isLab }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;justify-content:flex-end\">\n              <button type=\"button\" sc-camel-on-click=\"{{ health.add }}\" class=\"nw\" style=\"padding:9px 15px;border:0;border-radius:999px;background:#c67139;color:#f7edda;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#b2622d\" style-active=\"transform:scale(.96)\">+ เพิ่มผลตรวจ<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ health.hasLatest }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:12px\">\n                <button type=\"button\" sc-camel-on-click=\"{{ health.editLatest }}\" style=\"width:100%;text-align:left;border-radius:24px;border:1px solid rgba(32,30,29,.1);background:#faf3e6;padding:16px 17px;display:flex;flex-direction:column;gap:13px;font:inherit;color:inherit;cursor:pointer\" style-hover=\"background:#fff8ec;border-color:rgba(198,113,57,.45)\" style-active=\"transform:scale(.995)\">\n                  <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%\">\n                    <span class=\"nw\" style=\"font-size:12.5px;font-weight:700\">ผลตรวจล่าสุด<\u002Fspan>\n                    <span class=\"nw\" style=\"font-size:11.5px;color:#82796a\">{{ health.latestDate }}<\u002Fspan>\n                  <\u002Fdiv>\n\n                  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:11px;width:100%\">\n                    <sc-for list=\"{{ health.markers }}\" as=\"mk\" hint-placeholder-count=\"4\">\n                      <div style=\"border-radius:18px;background:#f5ead8;padding:12px 13px;display:flex;flex-direction:column;gap:5px\">\n                        <div class=\"nw\" style=\"font-size:10.5px;color:#645c50;font-weight:600\">{{ mk.label }}<\u002Fdiv>\n                        <div style=\"display:flex;align-items:baseline;gap:7px\">\n                          <span class=\"nw\" style=\"font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;color:{{ mk.valueColor }}\">{{ mk.value }}<\u002Fspan>\n                          <sc-if value=\"{{ mk.hasDelta }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span class=\"nw\" style=\"font-size:10.5px;font-weight:700;color:{{ mk.deltaColor }}\">{{ mk.deltaTxt }}<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                        <span style=\"{{ mk.bandStyle }};align-self:flex-start\">{{ mk.band }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n\n                  <div class=\"nw\" style=\"font-size:12px;font-weight:700;color:{{ health.verdictColor }}\">{{ health.verdict }}<\u002Fdiv>\n                  <sc-if value=\"{{ health.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11.5px;color:#645c50;line-height:1.5;width:100%\">{{ health.latestNote }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ health.none }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-radius:22px;border:1px dashed rgba(32,30,29,.2);padding:22px 18px;text-align:center;font-size:12.5px;color:#645c50;line-height:1.6\">ยังไม่มีผลตรวจบันทึกไว้ — กด “+ เพิ่มผลตรวจ” แล้วกรอกค่าจากใบผลเลือด คอเลสเตอรอลรวม LDL HDL และไตรกลีเซอไรด์<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ health.hasHistory }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <h5 class=\"nw\" style=\"margin:2px 0 0;font-size:15px;font-family:'Caprasimo','Noto Sans Thai',sans-serif\">ผลตรวจก่อนหน้า<\u002Fh5>\n                <sc-for list=\"{{ health.history }}\" as=\"hx\" hint-placeholder-count=\"2\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ hx.edit }}\" style=\"width:100%;text-align:left;padding:12px 15px;border:1px solid rgba(32,30,29,.1);border-radius:18px;background:#faf3e6;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px\" style-hover=\"background:#fff8ec;border-color:rgba(198,113,57,.45)\" style-active=\"transform:scale(.995)\">\n                    <span class=\"nw\" style=\"font-size:12.5px;font-weight:700\">{{ hx.date }}<\u002Fspan>\n                    <span style=\"font-size:11px;color:#645c50;font-variant-numeric:tabular-nums\">{{ hx.summary }}<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"font-size:10.5px;color:#82796a;line-height:1.5;text-align:center\">เกณฑ์อ้างอิงตามมาตรฐานที่ห้องปฏิบัติการในไทยใช้ (mg/dL) — เป็นข้อมูลประกอบเท่านั้น การวินิจฉัยต้องมาจากแพทย์<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hv.isDoc }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                <div>\n                  <div class=\"nw\" style=\"font-size:13px;font-weight:700\">เอกสารสุขภาพ<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#82796a;margin-top:2px\">{{ docs.summary }}<\u002Fdiv>\n                <\u002Fdiv>\n                <label class=\"nw\" style=\"padding:9px 15px;border:0;border-radius:999px;background:#c67139;color:#f7edda;font-size:12.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#b2622d\">\n                  + อัปโหลด\n                  <input type=\"file\" accept=\"image/*,application/pdf\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ docs.onFiles }}\" style=\"display:none\">\n                <\u002Flabel>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ docs.hasErr }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-radius:18px;background:#f3e0d6;border:1px solid rgba(198,47,28,.25);padding:12px 15px;font-size:11.5px;color:#c62f1c;line-height:1.55\">{{ docs.err }}<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ docs.busy }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:20px;background:#faf3e6;border:1px solid rgba(32,30,29,.1)\">\n                  <span style=\"width:7px;height:7px;border-radius:50%;background:#c67139;animation:pulseDot 1.4s infinite\"><\u002Fspan>\n                  <span style=\"font-size:12.5px;color:#645c50\">กำลังบันทึกไฟล์…<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ docs.none }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"border-radius:22px;border:1px dashed rgba(32,30,29,.2);background:#faf3e6;padding:26px 20px;text-align:center;font-size:12px;color:#645c50;line-height:1.6\">ยังไม่มีเอกสาร — เก็บใบผลตรวจ ใบรับรองแพทย์ ฟิล์มเอกซเรย์ หรือกรมธรรม์ไว้ที่นี่ เปิดดูและดาวน์โหลดได้ทุกเครื่องที่ล็อกอิน<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ docs.hasAny }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:10px\">\n                  <sc-for list=\"{{ docs.rows }}\" as=\"dc\" hint-placeholder-count=\"3\">\n                    <div style=\"border-radius:20px;border:1px solid rgba(32,30,29,.1);background:#faf3e6;padding:13px 14px;display:flex;align-items:center;gap:12px\">\n                      <div style=\"{{ dc.iconStyle }}\">{{ dc.ext }}<\u002Fdiv>\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ dc.name }}<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#82796a;margin-top:2px\">{{ dc.meta }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <a href=\"{{ dc.href }}\" download=\"{{ dc.name }}\" title=\"ดาวน์โหลด\" class=\"nw\" style=\"flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(198,113,57,.4);display:flex;align-items:center;justify-content:center;color:#8c491a;text-decoration:none\" style-hover=\"background:rgba(198,113,57,.1)\">\n                        <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:17px;height:17px\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"m7 11 5 5 5-5\"><\u002Fpath><path d=\"M4 20h16\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fa>\n                      <button type=\"button\" sc-camel-on-click=\"{{ dc.remove }}\" title=\"ลบ\" class=\"nw\" style=\"flex:none;width:38px;height:38px;border-radius:50%;border:1px solid rgba(198,47,28,.3);background:transparent;color:#c62f1c;font-size:14px;cursor:pointer\" style-hover=\"background:rgba(198,47,28,.08)\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"font-size:10.5px;color:#82796a;line-height:1.5;text-align:center\">รองรับรูปภาพและ PDF ไฟล์ละไม่เกิน 4 MB — รูปถ่ายจะถูกย่อให้เล็กลงอัตโนมัติก่อนเก็บ<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hv.isIll }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n                <div>\n                  <h5 class=\"nw\" style=\"margin:0;font-size:16px;font-family:'Caprasimo','Noto Sans Thai',sans-serif\">ประวัติการเจ็บป่วย<\u002Fh5>\n                  <sc-if value=\"{{ ill.hasOngoing }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-size:11px;color:#8c491a;margin-top:3px;font-weight:700\">กำลังรักษาอยู่ {{ ill.ongoingCount }} รายการ<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ ill.add }}\" class=\"nw\" style=\"padding:9px 15px;border:0;border-radius:999px;background:#c67139;color:#f7edda;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#b2622d\" style-active=\"transform:scale(.96)\">+ บันทึก<\u002Fbutton>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ ill.hasAny }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                  <sc-for list=\"{{ ill.rows }}\" as=\"ep\" hint-placeholder-count=\"3\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ ep.edit }}\" style=\"width:100%;text-align:left;padding:13px 15px;border:1px solid rgba(32,30,29,.1);border-radius:20px;background:#faf3e6;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:5px\" style-hover=\"background:#fff8ec;border-color:rgba(198,113,57,.45)\" style-active=\"transform:scale(.995)\">\n                      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%\">\n                        <span class=\"nw\" style=\"font-size:10.5px;color:#82796a\">{{ ep.date }}<\u002Fspan>\n                        <span style=\"{{ ep.badgeStyle }}\">{{ ep.badge }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <span style=\"font-size:13.5px;font-weight:700;line-height:1.4\">{{ ep.title }}<\u002Fspan>\n                      <sc-if value=\"{{ ep.hasSub }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font-size:11.5px;color:#645c50;line-height:1.5\">{{ ep.sub }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ ill.none }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"border-radius:22px;border:1px dashed rgba(32,30,29,.2);padding:22px 18px;text-align:center;font-size:12.5px;color:#645c50;line-height:1.6;margin-top:12px\">ยังไม่มีบันทึก — กด “+ บันทึก” ทุกครั้งที่ไม่สบายหรือไปพบแพทย์ เก็บไว้ว่าอาการอะไร แพทย์ว่าอย่างไร ได้ยาอะไร<\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"font-size:10.5px;color:#82796a;line-height:1.5;text-align:center;margin-top:14px\">ประวัติที่บันทึกไว้ช่วยให้ผู้ช่วยเห็นรูปแบบที่เกิดซ้ำ และช่วยให้คุณเล่าให้แพทย์ฟังได้ครบเมื่อไปพบจริง<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hv.isAsk }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <div>\n                <h5 class=\"nw\" style=\"margin:0;font-size:16px;font-family:'Caprasimo','Noto Sans Thai',sans-serif\">ปรึกษาอาการ<\u002Fh5>\n                <div style=\"font-size:11px;color:#645c50;margin-top:3px\">ผู้ช่วยเห็นประวัติทั้งหมดของคุณ<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ hq.hasChat }}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ hq.clear }}\" class=\"nw\" style=\"padding:8px 13px;border:1px solid rgba(32,30,29,.16);border-radius:999px;background:transparent;color:#645c50;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(32,30,29,.06)\">เริ่มใหม่<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hq.empty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <div style=\"border-radius:18px;background:#ebddc5;padding:12px 15px;font-size:11.5px;color:#645c50;line-height:1.55\">ถ่ายรูปใบผลตรวจแล้วแนบมาได้เลย ผู้ช่วยจะอ่านค่าให้และอธิบายทีละรายการ<\u002Fdiv>\n                <sc-for list=\"{{ hq.suggestions }}\" as=\"sg\" hint-placeholder-count=\"4\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ sg.pick }}\" style=\"width:100%;text-align:left;padding:11px 15px;border:1px solid rgba(32,30,29,.1);border-radius:18px;background:#faf3e6;font:inherit;font-size:12.5px;color:#201e1d;cursor:pointer;line-height:1.5\" style-hover=\"background:#fff8ec;border-color:rgba(198,113,57,.45)\" style-active=\"transform:scale(.995)\">{{ sg.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hq.hasChat }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ hq.rows }}\" as=\"m\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;flex-direction:column;gap:4px\">\n                    <span style=\"{{ m.whoStyle }}\">{{ m.who }}<\u002Fspan>\n                    <sc-if value=\"{{ m.hasThumbs }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"align-self:flex-end;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end\">\n                        <sc-for list=\"{{ m.thumbs }}\" as=\"th\" hint-placeholder-count=\"1\">\n                          <div role=\"img\" aria-label=\"ใบผลตรวจที่ส่ง\" style=\"{{ th.style }}\"><\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"{{ m.style }}\">{{ m.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hq.loading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"align-self:flex-start;display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:20px;background:#faf3e6;border:1px solid rgba(32,30,29,.1)\">\n                <span style=\"width:7px;height:7px;border-radius:50%;background:#c67139;animation:pulseDot 1.4s infinite\"><\u002Fspan>\n                <span style=\"font-size:12.5px;color:#645c50\">กำลังเรียกบทสนทนาเดิม…<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hq.busy }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"align-self:flex-start;display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:20px;background:#faf3e6;border:1px solid rgba(32,30,29,.1)\">\n                <span style=\"width:7px;height:7px;border-radius:50%;background:#c67139;animation:pulseDot 1.4s infinite\"><\u002Fspan>\n                <span style=\"font-size:12.5px;color:#645c50\">กำลังอ่านผลตรวจของคุณ…<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hq.hasErr }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-radius:18px;background:#f3e0d6;border:1px solid rgba(198,47,28,.25);padding:12px 15px;font-size:11.5px;color:#c62f1c;line-height:1.55\">{{ hq.err }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ hq.hasImages }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n                <sc-for list=\"{{ hq.images }}\" as=\"im\" hint-placeholder-count=\"1\">\n                  <div style=\"position:relative;width:76px;height:76px;border-radius:16px;overflow:hidden;border:1px solid rgba(32,30,29,.14)\">\n                    <div role=\"img\" aria-label=\"ใบผลตรวจที่แนบ\" style=\"{{ im.style }}\"><\u002Fdiv>\n                    <button type=\"button\" sc-camel-on-click=\"{{ im.drop }}\" style=\"position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(32,30,29,.72);color:#f7edda;font-size:12px;line-height:1;cursor:pointer\" style-hover=\"background:#c62f1c\">✕<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;gap:8px;align-items:flex-end\">\n              <sc-if value=\"{{ hq.canAttach }}\" hint-placeholder-val=\"{{ true }}\">\n                <label title=\"แนบรูปใบผลตรวจ\" style=\"flex:none;display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:999px;border:1px solid rgba(198,113,57,.45);background:transparent;color:#8c491a;cursor:pointer\" style-hover=\"background:rgba(198,113,57,.1)\">\n                  <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.75\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:21px;height:21px\"><path d=\"M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z\"><\u002Fpath><circle cx=\"12\" cy=\"13\" r=\"3.5\"><\u002Fcircle><\u002Fsvg>\n                  <input type=\"file\" accept=\"image/*\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ hq.onFiles }}\" style=\"display:none\">\n                <\u002Flabel>\n              <\u002Fsc-if>\n              <textarea value=\"{{ hq.input }}\" sc-camel-on-change=\"{{ hq.setInput }}\" sc-camel-on-key-down=\"{{ hq.onKey }}\" rows=\"2\" placeholder=\"เล่าอาการ หรือถามเรื่องผลตรวจ…\" style=\"flex:1;min-width:0;min-height:52px;max-height:140px;padding:12px 16px;font:inherit;font-size:13.5px;line-height:1.5;border-radius:22px;border:1px solid rgba(32,30,29,.16);background:#faf3e6;color:#201e1d;resize:vertical\" style-focus=\"outline:2px solid #c67139;outline-offset:2px\"><\u002Ftextarea>\n              <button type=\"button\" sc-camel-on-click=\"{{ hq.send }}\" class=\"nw\" style=\"flex:none;padding:14px 20px;border:0;border-radius:999px;background:#c67139;color:#f7edda;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#b2622d\" style-active=\"transform:scale(.97)\">{{ hq.cta }}<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"font-size:10.5px;color:#82796a;line-height:1.5;text-align:center\">ผู้ช่วยให้ข้อมูลประกอบความเข้าใจเท่านั้น ไม่วินิจฉัยโรคและไม่แนะนำเรื่องยา — การรักษาต้องมาจากแพทย์<\u002Fdiv>\n            <\u002Fsc-if>\n\n\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isAi }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:18px 18px 26px;display:flex;flex-direction:column;gap:15px;animation:riseIn .28s ease both\">\n            <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n              <div>\n                <div class=\"nw\" style=\"font:600 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8c491a\">ปรึกษาการเงิน<\u002Fdiv>\n                <h4 style=\"margin:6px 0 0;font-size:25px;font-family:'Caprasimo','Noto Sans Thai',sans-serif\">ที่ปรึกษา<\u002Fh4>\n                <div style=\"font-size:11.5px;color:#645c50;margin-top:4px\">{{ ai.subtitle }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ ai.hasChat }}\" hint-placeholder-val=\"{{ false }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ ai.clear }}\" class=\"nw\" style=\"padding:9px 14px;border:1px solid rgba(32,30,29,.16);border-radius:999px;background:transparent;color:#645c50;font:inherit;font-size:12px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(32,30,29,.06)\">เริ่มใหม่<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ ai.empty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-if value=\"{{ ai.remembers }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"border-radius:22px;background:#ebddc5;padding:14px 16px;font-size:11.5px;color:#645c50;line-height:1.6\">ถามอะไรก็ได้เกี่ยวกับพอร์ต หนี้สิน หรือเป้าหมายของคุณ — บทสนทนาถูกเก็บไว้ในบัญชีของคุณ เปิดจากเครื่องไหนก็คุยต่อได้ กด “เริ่มใหม่” เพื่อลบทั้งหมด<\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ ai.transient }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"border-radius:22px;background:#ebddc5;padding:14px 16px;font-size:11.5px;color:#645c50;line-height:1.6\">ถามอะไรก็ได้เกี่ยวกับพอร์ต หนี้สิน หรือเป้าหมายของคุณ — โหมดทดลองไม่บันทึกบทสนทนา ปิดหน้านี้แล้วเริ่มใหม่ทุกครั้ง<\u002Fdiv>\n                <\u002Fsc-if>\n                <div class=\"nw\" style=\"font-size:11px;color:#645c50;font-weight:600\">เริ่มจากคำถามเหล่านี้<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:7px\">\n                  <sc-for list=\"{{ ai.suggestions }}\" as=\"sg\" hint-placeholder-count=\"5\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ sg.pick }}\" style=\"width:100%;text-align:left;padding:12px 15px;border:1px solid rgba(32,30,29,.1);border-radius:18px;background:#faf3e6;font:inherit;font-size:13px;color:#201e1d;cursor:pointer;line-height:1.5\" style-hover=\"background:#fff8ec;border-color:rgba(198,113,57,.45)\" style-active=\"transform:scale(.995)\">{{ sg.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ ai.hasChat }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-direction:column;gap:10px\">\n                <sc-for list=\"{{ ai.rows }}\" as=\"m\" hint-placeholder-count=\"2\">\n                  <div style=\"display:flex;flex-direction:column;gap:4px\">\n                    <span style=\"{{ m.whoStyle }}\">{{ m.who }}<\u002Fspan>\n                    <div style=\"{{ m.style }}\">{{ m.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ ai.loading }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"align-self:flex-start;display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:20px;background:#faf3e6;border:1px solid rgba(32,30,29,.1)\">\n                <span style=\"width:7      <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"font-size:11px;color:#82796a;text-align:center\">อัปเดตล่าสุด {{ clock }} · ราคาทองอ้างอิงสมาคมค้าทองคำ<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"animation:riseIn .28s ease both\">\n            <div style=\"padding:16px 18px 0;display:flex;align-items:center;gap:12px\">\n              <button type=\"button\" sc-camel-on-click=\"{{ back }}\" style=\"width:38px;height:38px;border-radius:50%;border:1px solid rgba(32,30,29,.14);background:#faf3e6;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:#ffe1d0\">←<\u002Fbutton>\n              <div>\n                <div class=\"nw\" style=\"font-size:16px;font-weight:700;letter-spacing:-.01em\">{{ detail.sym }}<\u002Fdiv>\n                <div class=\"nw\" style=\"font-size:11px;color:#82796a\">{{ detail.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:14px 18px 0;display:flex;align-items:flex-end;gap:10px\">\n              <div style=\"font-family:'Caprasimo',sans-serif;font-size:42px;line-height:1.15;font-variant-numeric:tabular-nums;color:{{ detail.color }}\">{{ detail.price }}<\u002Fdiv>\n              <div style=\"padding-bottom:7px;font-size:13.5px;font-weight:700;white-space:nowrap;color:{{ detail.color }}\">{{ detail.chgTxt }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:16px 18px 26px;display:flex;flex-direction:column;gap:14px\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px\">\n                <sc-for list=\"{{ detail.stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n                  <div style=\"border-radius:18px;background:#ebddc5;padding:11px 13px\">\n                    <div style=\"font-size:10.5px;color:#645c50;font-weight:600;letter-spacing:.03 ackground:transparent;color:#8c491a;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(198,113,57,.1)\">ตรวจสอบ<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ admin.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:9px;border-radius:16px;background:#e1eecc;border:1px solid rgba(86,99,63,.25);padding:11px 14px;font-size:11.5px;color:#3f4a2d;line-height:1.55\">{{ admin.note }}<\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ admin.hasShared }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:9px;display:flex;gap:8px;flex-wrap:wrap\">\n                <sc-for list=\"{{ admin.splitTargets }}\" as=\"sp\" hint-placeholder-count=\"1\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ sp.go }}\" class=\"nw\" style=\"padding:9px 15px;border-radius:999px;border:0;background:#a63c26;color:#fdeee9;font:inherit;font-size:12px;font-weight:700;cursor:pointer\" style-hover=\"background:#8c3220\" style-active=\"transform:scale(.96)\">{{ sp.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ admin.users }}\" as=\"u\" hint-placeholder-count=\"2\">\n                <div style=\"display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;background:#faf3e6;border:1px solid rgba(32,30,29,.09)\">\n                  <div style=\"min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:8px\">\n                      <span style=\"font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ u.name }}<\u002Fspan>\n                      <span style=\"{{ u.roleStyle }}\">{{ u.roleTxt }}<\u002Fspan>\n                    <\u002Fdiv>\n
