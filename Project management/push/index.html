(%)<\u002Fdiv>\n                  <input type=\"number\" sc-camel-input-mode=\"decimal\" value=\"{{ editor.rate }}\" sc-camel-on-change=\"{{ editor.setRate }}\" placeholder=\"0.00\" style=\"width:100%;min-height:42px;padding:8px 12px;font:inherit;font-size:14px;border-radius:999px;border:1px solid rgba(32,30,29,.16);background:#faf3e6;color:#201e1d\">\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11px;color:#645c50;font-weight:600;margin-bottom:5px\">ผ่อนต่อเดือน (บาท)<\u002Fdiv>\n                  <input type=\"number\" sc-camel-input-mode=\"decimal\" value=\"{{ editor.monthly }}\" sc-camel-on-change=\"{{ editor.setMonthly }}\" placeholder=\"0\" style=\"width:100%;min-height:42px;padding:8px 12px;font:inherit;font-size:14px;border-radius:999px;border:1px solid rgba(32,30,29,.16);background:#faf3e6;color:#201e1d\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"margin-top:14px;padding:12px 14px;border-radius:20px;background:#ebddc5;display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <span class=\"nw\" style=\"font-size:12px;color:#645c50;font-weight:600\">{{ editor.previewLabel }}<\u002Fspan>\n              <span class=\"nw\" style=\"font-size:15px;font-weight:700;color:{{ editor.previewColor }}\">{{ editor.previewTxt }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ editor.canTrade }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;border-radius:20px;border:1px solid rgba(32,30,29,.1);background:#faf3e6;padding:14px 15px;display:flex;flex-direction:column;gap:11px\">\n                <div>\n                  <div class=\"nw\" style=\"font:600 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;color:#8c491a\">บันทึกการซื้อขาย<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#645c50;line-height:1.5;margin-top:4px\">{{ editor.logSummary }}<\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;gap:8px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ editor.openBuy }}\" class=\"nw\" style=\"flex:1;padding:11px;border:0;border-radius:999px;background:#c67139;color:#f7edda;font:inherit;font-size:13px;font-weight:700;cursor:pointer\" style-hover=\"background:#b2622d\" style-active=\"transform:scale(.97)\">+ ซื้อเพิ่ม<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ editor.openSell }}\" class=\"nw\" style=\"flex:1;padding:11px;border:1px solid rgba(86,99,63,.4);border-radius:999px;background:transparent;color:#56633f;font:inherit;font-size:13px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(86,99,63,.1)\" style-active=\"transform:scale(.97)\">− ขายบางส่วน<\u002Fbutton>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-direction:column;gap:7px\">\n                  <sc-for list=\"{{ editor.logRows }}\" as=\"lg\" hint-placeholder-count=\"2\">\n                    <div style=\"display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:9px;padding:9px 11px;border-radius:14px;background:#f5ead8\">\n                      <span style=\"{{ lg.chipStyle }}\">{{ lg.chip }}<\u002Fspan>\n                      <div style=\"min-width:0\">\n                        <div class=\"nw\" style=\"font-size:12.5px;font-weight:700\">{{ lg.label }}<\u002Fdiv>\n                        <div style=\"font-size:10px;color:#82796a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ lg.meta }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div class=\"nw\" style=\"font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:{{ lg.color }}\">{{ lg.amount }}<\u002Fdiv>\n                      <button type=\"button\" sc-camel-on-click=\"{{ lg.remove }}\" title=\"ลบรายการนี้\" class=\"nw\" style=\"width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:#a63c26;font:inherit;font-size:13px;cursor:pointer\" style-hover=\"background:rgba(166,60,38,.1)\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div style=\"display:flex;gap:9px;margin-top:14px\">\n              <sc-if value=\"{{ editor.canDelete }}\" hint-placeholder-val=\"{{ true }}\">\n                <button type=\"button\" sc-camel-on-click=\"{{ editor.remove }}\" class=\"nw\" style=\"padding:13px 18px;border-radius:999px;border:1px solid rgba(166,60,38,.4);background:transparent;color:#a63c26;font:inherit;font-size:14px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(166,60,38,.08)\">ลบ<\u002Fbutton>\n              <\u002Fsc-if>\n              <button type=\"button\" sc-camel-on-click=\"{{ editor.save }}\" style=\"flex:1;padding:13px;border:0;border-radius:999px;background:#c67139;color:#f7edda;font:inherit;font-size:14px;font-weight:700;cursor:pointer\" style-hover=\"background:#b2622d\" style-active=\"background:#8c491a\">บันทึก<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tabEditor.open }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(32,30,29,.42)\">\n          <div sc-camel-on-click=\"{{ tabEditor.close }}\" style=\"flex:1\"><\u002Fdiv>\n          <div style=\"background:#f5ead8;border-radius:28px 28px 0 0;padding:16px 18px 22px;box-shadow:0 -12px 32px rgba(46,43,37,.22);animation:riseIn .24s ease both;max-height:88%;overflow:auto\">\n            <div style=\"width:44px;height:4px;border-radius:999px;background:rgba(32,30,29,.18);margin:0 auto 14px\"><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <h5 class=\"nw\" style=\"margin:0;font-size:18px;font-family:'Caprasimo','Noto Sans Thai',sans-serif\">ปรับแถบเมนู<\u002Fh5>\n              <button type=\"button\" sc-camel-on-click=\"{{ tabEditor.close }}\" class=\"nw\" style=\"width:32px;height:32px;border-radius:50%;border:1px solid rgba(32,30,29,.14);background:transparent;font-size:15px;cursor:pointer;color:#645c50\" style-hover=\"background:rgba(32,30,29,.06)\">✕<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#645c50;line-height:1.5;margin-top:8px\">เลือกหน้าที่อยากให้แสดงในแถบล่าง และเรียงลำดับตามที่ใช้บ่อย<\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px\">\n              <sc-for list=\"{{ tabEditor.rows }}\" as=\"tr\" hint-placeholder-count=\"6\">\n                <div style=\"{{ tr.rowStyle }}\">\n                  <div style=\"width:30px;height:30px;border-radius:12px;background:#ebddc5;display:flex;align-items:center;justify-content:center;font-size:15px\">{{ tr.glyph }}<\u002Fdiv>\n                  <div style=\"min-width:0;display:flex;align-items:center;gap:8px\">\n                    <span class=\"nw\" style=\"font-size:13.5px;font-weight:700\">{{ tr.label }}<\u002Fspan>\n                    <span style=\"{{ tr.badgeStyle }}\">{{ tr.badge }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:5px\">\n                    <sc-if value=\"{{ tr.movable }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ tr.up }}\" style=\"width:30px;height:30px;border-radius:50%;border:1px solid rgba(32,30,29,.14);background:transparent;color:#645c50;font:inherit;font-size:13px;cursor:pointer\" style-hover=\"background:rgba(32,30,29,.06)\" style-active=\"transform:scale(.92)\">↑<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ tr.movable }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ tr.down }}\" style=\"width:30px;height:30px;border-radius:50%;border:1px solid rgba(32,30,29,.14);background:transparent;color:#645c50;font:inherit;font-size:13px;cursor:pointer\" style-hover=\"background:rgba(32,30,29,.06)\" style-active=\"transform:scale(.92)\">↓<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ tr.on }}\" hint-placeholder-val=\"{{ true }}\">\n                      <sc-if value=\"{{ tr.movable }}\" hint-placeholder-val=\"{{ true }}\">\n                        <button type=\"button\" sc-camel-on-click=\"{{ tr.toggle }}\" class=\"nw\" style=\"padding:6px 12px;border-radius:999px;border:1px solid rgba(166,60,38,.35);background:transparent;color:#a63c26;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(166,60,38,.08)\">ซ่อน<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ tr.off }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button type=\"button\" sc-camel-on-click=\"{{ tr.toggle }}\" class=\"nw\" style=\"padding:6px 12px;border-radius:999px;border:0;background:#c67139;color:#f7edda;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer\" style-hover=\"background:#b2622d\">แสดง<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <button type=\"button\" sc-camel-on-click=\"{{ tabEditor.reset }}\" style=\"width:100%;margin-top:14px;padding:12px;border:1px solid rgba(32,30,29,.16);border-radius:999px;background:transparent;color:#645c50;font:inherit;font-size:13px;font-weight:700;cursor:pointer\" style-hover=\"background:rgba(32,30,29,.05)\">คืนค่าเริ่มต้น<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;flex-direction:column;border-top:1px solid rgba(32,30,29,.12);background:#ebddc5\">\n        <div style=\"display:flex;align-items:stretch;gap:6px;padding:8px 10px 4px\">\n          <div style=\"flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto\">\n            <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\" style-active=\"transform:scale(.96)\">\n                <span style=\"font-size:19px;line-height:1\">{{ t.glyph }}<\u002Fspan>\n                <span style=\"font-size:11px;font-weight:600;white-space:nowrap\">{{ t.label }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ tabEditor.show }}\" title=\"ปรับแถบเมนู\" style=\"flex:none;width:38px;border:0;border-radius:18px;background:transparent;color:#82796a;font:inherit;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center\" style-hover=\"background:rgba(32,30,29,.06);color:#8c491a\" style-active=\"transform:scale(.94)\">⋯<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px calc(8px + env(safe-area-inset-bottom))\">\n          <span class=\"nw\" style=\"font-size:9.5px;color:#8f8474;text-align:center\">{{ legal.line }}<\u002Fspan>\n          <span class=\"nw\" style=\"font:600 8.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.06em;color:#a89c88\">v{{ build }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:1000}}\">\n// m2 = closing price two months ago (for the 2-month change);\n// er = next scheduled earnings report (approximate — companies confirm ~3 weeks ahead).\n// Reference data for symbols the app knows about — names, the two-month\n// comparison and the next earnings date. It is NOT a watchlist: what each\n// account sees is derived from the rows that account actually owns.\nconst DR_META = [\n  { sym: 'GOOG80', name: 'Alphabet Inc · DR', base: 6.15, last: 6.30, v: 1.1, m2: 5.42, er: '2026-10-27' },\n  { sym: 'AVGO80', name: 'Broadcom Inc · DR', base: 2.64, last: 2.76, v: 1.3, m2: 2.31, er: '2026-09-03' },\n  { sym: 'NVDA80', name: 'NVIDIA Corp · DR', base: 34.50, last: 36.00, v: 1.5, m2: 31.20, er: '2026-08-26' },\n  { sym: 'MSFT80', name: 'Microsoft Corp · DR', base: 8.05, last: 8.20, v: 0.9, m2: 7.88, er: '2026-10-28' },\n  { sym: 'CEG23', name: 'Constellation Energy · DR', base: 2.32, last: 2.26, v: 1.2, m2: 2.44, er: '2026-11-04' },\n  { sym: 'ES-GTECH', name: 'Eastspring Global Technology · กองทุนรวม', base: 33.34, last: 33.34, v: 1.0, m2: 30.95, er: '', fund: true },\n];\n// Mutual funds: NAV comes from the feed once per business day, not intraday.\nconst FUND_SYMS = { 'ES-GTECH': true };\nconst TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];\nfunction erLabel(iso) {\n  if (!iso) return null;\n  const d = new Date(iso + 'T00:00:00');\n  if (isNaN(d)) return null;\n  const days = Math.round((d - new Date(new Date().toDateString())) / 86400000);\n  return {\n    text: d.getDate() + ' ' + TH_MONTHS[d.getMonth()] + ' ' + String(d.getFullYear() + 543).slice(2),\n    away: days > 0 ? 'อีก ' + days + ' วัน' : (days === 0 ? 'วันนี้' : 'ผ่านไปแล้ว'),\n    soon: days >= 0 && days <= 14,\n  };\n}\n// Dividends are cash actually received, so they are recorded per payment\n// (symbol, pay date, amount) rather than derived from a yield estimate.\nconst DIV0 = [\n  { id: 1, pf: 'bancha', sym: 'GOOG80', date: '2026-06-15', amount: 1240, note: 'ปันผลไตรมาส 2' },\n  { id: 2, pf: 'bancha', sym: 'MSFT80', date: '2026-06-11', amount: 980, note: '' },\n  { id: 3, pf: 'wellcon', sym: 'AVGO80', date: '2026-06-30', amount: 2150, note: '' },\n];\n// Every screen the bottom bar can show. 'home' is fixed: an app with no way\n// back to the watchlist would strand the user.\nconst TAB_CATALOG = [\n  { key: 'home', label: 'หน้าแรก', glyph: '◎', fixed: true },\n  { key: 'port', label: 'พอร์ต', glyph: '◱' },\n  { key: 'net', label: 'สินทรัพย์', glyph: '▣' },\n  { key: 'debt', label: 'หนี้สิน', glyph: '▽' },\n  { key: 'flip', label: 'บ้าน-ที่ดิน', glyph: '⌂' },\n  { key: 'plan', label: 'เป้าหมาย', glyph: '◹' },\n  // Gold market prices live inside the assets screen now, but the screen is\n  // still a real destination — offer it as an optional tab rather than losing it.\n  { key: 'gold', label: 'ราคาทอง', glyph: '◈' },\n  // Reached from the persistent bar at the top of every screen, not the bottom bar.\n  { key: 'ai', label: 'ที่ปรึกษา', glyph: '✦', topOnly: true },\n  { key: 'health', label: 'สุขภาพ', glyph: '♡' },\n];\nconst DEFAULT_HIDDEN = { gold: true };\nconst TAB_BY = {}; TAB_CATALOG.forEach(t => { TAB_BY[t.key] = t; });\nconst DEFAULT_TABS = TAB_CATALOG.filter(t => !DEFAULT_HIDDEN[t.key] && !t.topOnly).map(t => t.key);\n// Screens an admin can switch off per account. 'home' is not offered: an app\n// with no way back to the watchlist would strand the user.\n// Kept beside the server's own rules in api/advise.js. Both must forbid\n// Markdown: the answer bubble is plain text, so ** and # would show up raw.\n// Mirrors SYSTEM_HEALTH in api/advise.js — the preview path has no server.\nconst HEALTH_RULES = [\n  'คุณเป็นผู้ช่วยให้ความรู้ด้านสุขภาพเบื้องต้น ตอบภาษาไทยกระชับไม่เกิน 250 คำ',\n  'อธิบายความหมายของค่าไขมันในเลือดและแนวโน้มเทียบครั้งก่อน',\n  'ห้ามวินิจฉัยโรค ห้ามแนะนำให้เริ่ม หยุด เพิ่ม หรือลดยาใดๆ',\n  'ถ้าค่าผิดปกติมากให้บอกตรงๆ ว่าควรพบแพทย์',\n  'ตอบเป็นข้อความธรรมดา ห้ามใช้ Markdown — ห้ามใช้ ** หรือ # หรือขึ้นต้นบรรทัดด้วย - หรือ 1.',\n  'ไม่ต้องปิดท้ายด้วยคำเตือน ตัวแอปแสดงข้อความกำกับให้อยู่แล้ว',\n].join('\\n');\nconst AI_RULES = [\n  'คุณเป็นผู้ช่วยให้ความรู้ทางการเงินส่วนบุคคลในไทย ตอบภาษาไทยกระชับไม่เกิน 250 คำ',\n  'อ้างอิงตัวเลขจากพอร์ตที่ให้มา ห้ามทำนายราคา ห้ามแนะนำซื้อขายหลักทรัพย์รายตัว',\n  'ตอบเป็นข้อความธรรมดาเท่านั้น ห้ามใช้ Markdown — ห้ามใช้ ** หรือ # หรือขึ้นต้นบรรทัดด้วย - หรือ 1.',\n  'ถ้าต้องแยกประเด็น ให้ใช้ย่อหน้าสั้นๆ คั่นด้วยบรรทัดว่าง',\n  'ไม่ต้องปิดท้ายด้วยคำเตือน ตัวแอปแสดงข้อความกำกับให้อยู่แล้ว',\n].join('\\n');\n// Lipid panel reference ranges (mg/dL), per the ATP III thresholds Thai labs\n// print on their result slips. HDL runs the other way — higher is better — so\n// direction is carried per marker rather than assumed.\nconst LIPIDS = [\n  { key: 'total', label: 'คอเลสเตอรอลรวม', short: 'Total', higherBetter: false,\n    bands: [[200, 'ปกติ', 'good'], [240, 'เริ่มสูง', 'warn'], [Infinity, 'สูง', 'bad']] },\n  { key: 'ldl', label: 'LDL — ไขมันไม่ดี', short: 'LDL', higherBetter: false,\n    bands: [[100, 'ดีมาก', 'good'], [130, 'ปกติ', 'good'], [160, 'เริ่มสูง', 'warn'], [Infinity, 'สูง', 'bad']] },\n  { key: 'hdl', label: 'HDL — ไขมันดี', short: 'HDL', higherBetter: true,\n    bands: [[40, 'ต่ำ', 'bad'], [60, 'ปกติ', 'good'], [Infinity, 'ดีมาก', 'good']] },\n  { key: 'trig', label: 'ไตรกลีเซอไรด์', short: 'TG', higherBetter: false,\n    bands: [[150, 'ปกติ', 'good'], [200, 'เริ่มสูง', 'warn'], [Infinity, 'สูง', 'bad']] },\n];\nconst LIPID_BY = {}; LIPIDS.forEach(x => { LIPID_BY[x.key] = x; });\n// The health assistant answers better when it knows who it is talking about.\n// Grouped so the sheet reads as a form, not a wall of forty inputs.\nconst PROFILE_GROUPS = [\n  { title: 'ตัวตน', fields: [\n    { key: 'name', label: 'ชื่อ-สกุล', ph: 'เช่น บัญชา ใจดี', wide: true },\n    { key: 'birth', label: 'ปีเกิด (ค.ศ.)', ph: 'เช่น 1970', mode: 'numeric' },\n    { key: 'sex', label: 'เพศ', type: 'sel', options: ['', 'ชาย', 'หญิง', 'อื่น ๆ'] },\n    { key: 'height', label: 'ส่วนสูง (ซม.)', ph: 'เช่น 172', mode: 'decimal' },\n    { key: 'weight', label: 'น้ำหนัก (กก.)', ph: 'เช่น 68', mode: 'decimal' },\n    { key: 'blood', label: 'กรุ๊ปเลือด', type: 'sel', options: ['', 'A Rh+', 'A Rh−', 'B Rh+', 'B Rh−', 'AB Rh+', 'AB Rh−', 'O Rh+', 'O Rh−', 'ไม่ทราบ'] },\n    { key: 'skin', label: 'สีผิว (Fitzpatrick)', type: 'sel',\n      options: ['', 'I — ขาวมาก ไหม้ง่าย', 'II — ขาว', 'III — ขาวอมเหลือง', 'IV — สองสี', 'V — คล้ำ', 'VI — คล้ำมาก'] },\n    { key: 'ethnicity', label: 'เชื้อชาติ', ph: 'เช่น ไทย / ไทยเชื้อสายจีน' },\n    { key: 'nationality', label: 'สัญชาติ', ph: 'เช่น ไทย' },\n  ] },\n  { title: 'ข้อมูลทางการแพทย์', fields: [\n    { key: 'allergies', label: 'แพ้ยา / แพ้อาหาร', ph: 'เช่น เพนิซิลลิน อาหารทะเล — ถ้าไม่มีให้ใส่ “ไม่มี”', type: 'area', wide: true },\n    { key: 'conditions', label: 'โรคประจำตัว', ph: 'เช่น ความดันโลหิตสูง เบาหวานชนิดที่ 2', type: 'area', wide: true },\n    { key: 'meds', label: 'ยาที่ใช้ประจำ', ph: 'เช่น Atorvastatin 20 mg วันละครั้ง', type: 'area', wide: true },\n    { key: 'supplements', label: 'อาหารเสริม / วิตามิน', ph: 'เช่น Vitamin D3 2000 IU', wide: true },\n    { key: 'surgery', label: 'ประวัติการผ่าตัด', ph: 'เช่น ผ่าตัดไส้ติ่ง ปี 2562', wide: true },\n    { key: 'family', label: 'โรคทางพันธุกรรม', ph: 'เช่น พ่อเบาหวาน แม่ความดันสูง', type: 'area', wide: true },\n  ] },\n  { title: 'ไลฟ์สไตล์', fields: [\n    { key: 'smoking', label: 'สูบบุหรี่', type: 'sel', options: ['', 'ไม่สูบ', 'เคยสูบ เลิกแล้ว', 'สูบอยู่'] },\n    { key: 'alcohol', label: 'ดื่มแอลกอฮอล์', type: 'sel', options: ['', 'ไม่ดื่ม', 'นานๆ ครั้ง', 'สัปดาห์ละครั้ง', 'เกือบทุกวัน'] },\n    { key: 'exercise', label: 'ออกกำลังกาย', type: 'sel', options: ['', 'ไม่ได้ออก', '1–2 ครั้ง/สัปดาห์', '3–4 ครั้ง/สัปดาห์', 'เกือบทุกวัน'] },\n    { key: 'diet', label: 'การกิน', ph: 'เช่น ทั่วไป / มังสวิรัติ / คุมแป้ง' },\n    { key: 'sleep', label: 'นอนเฉลี่ย (ชม./คืน)', ph: 'เช่น 7', mode: 'decimal' },\n  ] },\n  { title: 'ติดต่อและสิทธิการรักษา', fields: [\n    { key: 'hospital', label: 'โรงพยาบาลประจำ', ph: 'เช่น รพ.พระราม 9' },\n    { key: 'insurance', label: 'สิทธิการรักษา', ph: 'เช่น ประกันสังคม / ประกันกลุ่ม' },\n    { key: 'emergency', label: 'ติดต่อฉุกเฉิน', ph: 'เช่น สมชาย (บุตร) 081-234-5678', wide: true },\n  ] },\n];\nconst PROFILE_FIELDS = PROFILE_GROUPS.reduce((a, g) => a.concat(g.fields), []);\nfunction bmiOf(p) {\n  const h = Number(p.height) / 100, w = Number(p.weight);\n  if (!(h > 0.5) || !(w > 0)) return null;\n  const v = w / (h * h);\n  // Asia-Pacific cut-offs (WHO/กรมอนามัย) — lower than the Western ones,\n  // because metabolic risk rises earlier in Thai bodies.\n  const B = v < 18.5\n      ? { key: 'under', label: 'น้ำหนักน้อย', color: '#8c491a', tone: 'warn' }\n    : v < 23\n      ? { key: 'normal', label: 'สมส่วน', color: '#1c8f4a', tone: 'good' }\n    : v < 25\n      ? { key: 'over', label: 'ท้วม', color: '#8c491a', tone: 'warn' }\n    : v < 30\n      ? { key: 'ob1', label: 'อ้วนระดับ 1', color: '#c62f1c', tone: 'bad' }\n      : { key: 'ob2', label: 'อ้วนระดับ 2', color: '#c62f1c', tone: 'bad' };\n  const IDEAL = [18.5, 22.9];\n  const target = B.key === 'normal' ? null\n    : v < 18.5 ? +(IDEAL[0] * h * h - w).toFixed(1)\n    : +(w - IDEAL[1] * h * h).toFixed(1);\n  const HEAD = {\n    under: 'น้ำหนักต่ำกว่าเกณฑ์',\n    normal: 'อยู่ในเกณฑ์ที่ดี — รักษาไว้แบบนี้',\n    over: 'เกินเกณฑ์มานิดหน่อย',\n    ob1: 'เกินเกณฑ์อย่างชัดเจน',\n    ob2: 'เกินเกณฑ์มาก — ควรปรึกษาแพทย์',\n  };\n  const GOOD = {\n    under: 'น้ำหนักน้อยช่วยลดภาระข้อเข่าและหัวใจก็จริง แต่ข้อดีแค่นั้น',\n    normal: 'ช่วงนี้ความเสี่ยงเบาหวาน ความดันสูง และไขมันในเลือดต่ำที่สุด ขอชื่นชมที่ดูแลตัวเองได้ดี',\n    over: 'ยังห่างจากเกณฑ์อ้วน แก้ตอนนี้ง่ายกว่ารอให้ขึ้นไปอีกมาก',\n    ob1: 'น้ำหนักที่ลดได้เพียง 5% ก็ทำให้ความดันและน้ำตาลดีขึ้นชัดเจน',\n    ob2: 'แม้จะสูง การลดอย่างค่อยเป็นไปได้จริง และเห็นผลเร็วกว่าที่คิด',\n  };\n  const RISK = {\n    under: 'เสี่ยงมวลกล้ามเนื้อน้อย กระดูกบาง ภูมิคุ้มกันต่ำ และขาดธาตุเหล็ก',\n    normal: 'ความเสี่ยงจากน้ำหนักต่ำ — แต่ BMI ไม่ดูไขมันช่องท้อง รอบเอวก็ต้องดูด้วย',\n    over: 'ความดันและไขมันในเลือดมีแนวโน้มสูงขึ้น ถ้าปล่อยไว้มักขยับขึ้นสู่กลุ่มอ้วน',\n    ob1: 'เสี่ยงเบาหวานชนิดที่ 2 ความดันสูง ไขมันพอกตับ และนอนกรนหลับเพิ่มขึ้นอย่างชัดเจน',\n    ob2: 'ความเสี่ยงโรคหัวใจและหลอดเลือดสมองสูงขึ้นอย่างมีนัยสำคัญ ควรมีแผนร่วมกับแพทย์',\n  };\n  const ACT = {\n    under: 'เพิ่มมื้อย่อยที่มีโปรตีน และเล่นเวทเพื่อสร้างมวลกล้ามเนื้อ ไม่ใช่เพิ่มน้ำตาลอย่างเดียว',\n    normal: 'รักษากิจวัตรเดิม — ชั่งน้ำหนักเดือนละครั้งก็พอ',\n    over: 'ลดน้ำตาลและของทอด เดินเร็วหรือวิ่งเบาๆ สัปดาห์ละ 150 นาที',\n    ob1: 'ตั้งเป้าลด 5–10% ใน 6 เดือน ควบคู่คาร์โบกับออกกำลังกายแบบแอโรบิค + เวท',\n    ob2: 'ควรพบแพทย์เพื่อวางแผนร่วมกัน และตรวจน้ำตาล ไขมัน ความดัน ในคราวเดียวกัน',\n  };\n  return {\n    value: v, num: v.toFixed(1), band: B.label, key: B.key, tone: B.tone, color: B.color,\n    text: v.toFixed(1) + ' · ' + B.label,\n    headline: HEAD[B.key], good: GOOD[B.key], risk: RISK[B.key], action: ACT[B.key],\n    // How far from the healthy window, in kilos — vaguer advice is easy to ignore.\n    target,\n    targetText: !target ? '' : v < 18.5\n      ? 'อีกประมาณ ' + Math.abs(target).toFixed(1) + ' กก. จะเข้าเกณฑ์สมส่วน'\n      : 'ลดอีกประมาณ ' + Math.abs(target).toFixed(1) + ' กก. จะเข้าเกณฑ์สมส่วน',\n  };\n}\nconst BAND_COLOR = { good: '#1c8f4a', warn: '#8c491a', bad: '#c62f1c' };\nfunction lipidBand(key, v) {\n  const m = LIPID_BY[key];\n  if (!m || !(v > 0)) return null;\n  for (const [max, label, tone] of m.bands) if (v < max) return { label, tone, color: BAND_COLOR[tone] };\n  return null;\n}\nconst TOGGLEABLE = TAB_CATALOG.filter(t => !t.fixed && !t.topOnly).map(t => ({ key: t.key, label: t.label }));\nfunction allowedTabs(session) {\n  if (!session) return DEFAULT_TABS.slice();\n  if (session.role === 'admin' || !Array.isArray(session.features)) return TAB_CATALOG.map(t => t.key);\n  return TAB_CATALOG.filter(t => t.fixed || session.features.indexOf(t.key) >= 0).map(t => t.key);\n}\nconst DR_META_BY = {}; DR_META.forEach(d => { DR_META_BY[d.sym] = d; });\n// Portfolio sheets are per account, derived from the rows it holds. A brand-new\n// account gets one sheet named after itself rather than someone else's books.\n// Bumped whenever a change makes previously cached figures wrong (unit changes,\n// pricing rules). On mismatch every local cache is dropped and refetched, so a\n// stale browser cannot keep showing numbers computed by the old rules.\nconst BUILD = '2026.08.11-a';\n// The demo entry is a design/back-office affordance: it bypasses login and\n// loads sample figures, which must never be reachable on the deployed site.\n// Anything served from the Vercel domain is \"live\"; everywhere else (the design\n// preview, localhost) keeps it.\nconst IS_LIVE = (() => {\n  try { return /(^|\\.)vercel\\.app$/i.test(location.hostname); } catch (e) { return false; }\n})();\nconst SHEET_LABELS = { bancha: 'Bancha', wellcon: 'Wellcon', mali: 'Mali' };\n// Sheets the account has named explicitly win; any key found only on a row is\n// still listed so nothing can become unreachable.\nfunction sheetsOf(positions, username, owned) {\n  const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);\n  const out = [], seen = {};\n  (owned || []).forEach(x => { if (x && x.key && !seen[x.key]) { seen[x.key] = 1; out.push({ key: x.key, label: x.label || cap(x.key) }); } });\n  (positions || []).forEach(p => {\n    const k = p.pf || 'main';\n    if (!seen[k]) { seen[k] = 1; out.push({ key: k, label: SHEET_LABELS[k] || (k === 'main' ? cap(username || 'พอร์ตของฉัน') : cap(k)) }); }\n  });\n  if (!out.length) out.push({ key: 'main', label: cap(username || 'พอร์ตของฉัน') });\n  return [{ key: 'all', label: 'ภาพรวม' }].concat(out);\n}\n// Asset classes. Market-quoted kinds (dr, fund, gold) get their price from the\n// feed; the rest hold a value the owner sets, which is how personal balance\n// sheets actually work — a house is worth what a valuer last said it was.\nconst KINDS = [\n  { key: 'dr',        label: 'หุ้น / DR',    glyph: '◈', quoted: true,  unitLabel: 'จำนวน (หน่วย)', costLabel: 'ต้นทุน/หน่วย', color: '#c67139' },\n  { key: 'fund',      label: 'กองทุนรวม',    glyph: '◇', quoted: true,  unitLabel: 'จำนวน (หน่วย)', costLabel: 'ต้นทุน/หน่วย', color: '#b2622d' },\n  { key: 'gold',      label: 'ทองคำ',        glyph: '●', quoted: true,  unitLabel: 'น้ำหนัก (บาททอง)', costLabel: 'ต้นทุน/บาททอง', color: '#8c491a' },\n  { key: 'silver',    label: 'เงิน (Silver)', glyph: '◍', quoted: true,  unitLabel: 'น้ำหนัก (กิโลกรัม)', costLabel: 'ต้นทุน/กิโลกรัม', color: '#9aa2a8' },\n  { key: 'crypto',    label: 'Bitcoin',      glyph: '₿', quoted: true,  unitLabel: 'จำนวน (BTC)', costLabel: 'ต้นทุน/BTC', color: '#d4923f' },\n  { key: 'property',  label: 'ที่ดิน / บ้าน', glyph: '⌂', quoted: false, unitLabel: '',              costLabel: 'ราคาที่ซื้อมา',  color: '#7a8a5e', valueLabel: 'ราคาประเมินปัจจุบัน' },\n  { key: 'cash',      label: 'เงินฝาก / ออม', glyph: '▦', quoted: false, unitLabel: '',              costLabel: 'เงินต้นที่ฝาก',  color: '#56633f', valueLabel: 'ยอดคงเหลือปัจจุบัน' },\n  { key: 'insurance', label: 'ประกัน',       glyph: '◔', quoted: false, unitLabel: '',              costLabel: 'เบี้ยที่จ่ายสะสม', color: '#9aa87c', valueLabel: 'มูลค่าเวนคืนปัจจุบัน' },\n  { key: 'other',     label: 'อื่นๆ',         glyph: '◻', quoted: false, unitLabel: '',              costLabel: 'ต้นทุน',        color: '#c0b6a5', valueLabel: 'มูลค่าปัจจุบัน' },\n  { key: 'debt',      label: 'หนี้สิน',       glyph: '▽', quoted: false, unitLabel: '',              costLabel: 'วงเงินเดิม',    color: '#a63c26', valueLabel: 'ยอดค้างชำระ' },\n];\n// House-flip projects live in their own list: a flip is a project with a\n// lifecycle (buy → renovate → list → sell), not a holding with a unit price.\nconst FLIP_STAGES = [\n  { key: 'buying',   label: 'กำลังซื้อ',   color: '#c0b6a5' },\n  { key: 'reno',     label: 'กำลังรีโนเวท', color: '#c67139' },\n  { key: 'listed',   label: 'ประกาศขาย',   color: '#7a8a5e' },\n  { key: 'sold',     label: 'ขายแล้ว',     color: '#56633f' },\n];\nconst STAGE_BY = {}; FLIP_STAGES.forEach(x => { STAGE_BY[x.key] = x; });\nconst FLIP0 = [\n  { id: 1, name: 'ทาวน์โฮม ลาดพร้าว 71', stage: 'sold', buy: 3200000, reno: 850000, hold: 120000, target: 5200000, sellPrice: 5050000, buyDate: '2025-03-12', sellDate: '2025-11-04' },\n  { id: 2, name: 'บ้านเดี่ยว บางนา กม.7', stage: 'reno', buy: 5800000, reno: 1450000, hold: 180000, target: 9200000, sellPrice: '', buyDate: '2026-02-20', sellDate: '' },\n  { id: 3, name: 'คอนโด รัชดา 32', stage: 'listed', buy: 2400000, reno: 420000, hold: 60000, target: 3600000, sellPrice: '', buyDate: '2025-09-08', sellDate: '' },\n];\nconst KIND_BY = {}; KINDS.forEach(k => { KIND_BY[k.key] = k; });\n// A position may carry a trade log. When it does, quantity and average cost are\n// DERIVED from it — the log is the record, the totals are just a view of it.\n// Rows without a log keep behaving exactly as before.\n// A loan balance is not a fixed figure: it falls every month the instalment is\n// paid. Storing the balance with the date it was true on lets the app age it\n// forward instead of asking the owner to retype it each month.\nfunction monthsSince(iso) {\n  if (!iso) return 0;\n  const d = new Date(iso + 'T00:00:00');\n  if (isNaN(d)) return 0;\n  const now = new Date();\n  let m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth());\n  if (now.getDate() < d.getDate()) m -= 1;\n  return Math.max(0, m);\n}\n// Interest accrues on the outstanding balance first, then the instalment is\n// applied — the order a real amortising loan uses.\nfunction amortise(balance, annualRatePct, monthly, months) {\n  let bal = balance;\n  const r = (Number(annualRatePct) || 0) / 100 / 12;\n  const pay = Number(monthly) || 0;\n  if (pay <= 0) return bal;\n  for (let i = 0; i < months && bal > 0; i++) {\n    bal = bal * (1 + r) - pay;\n    if (bal < 0) bal = 0;\n  }\n  return bal;\n}\n// How many instalments until it clears, at the current rate and payment.\nfunction monthsToClear(balance, annualRatePct, monthly) {\n  const r = (Number(annualRatePct) || 0) / 100 / 12;\n  const pay = Number(monthly) || 0;\n  if (balance <= 0) return 0;\n  if (pay <= 0) return null;\n  if (pay <= balance * r) return null;\n  let bal = balance, n = 0;\n  while (bal > 0 && n < 1200) { bal = bal * (1 + r) - pay; n++; }\n  return n;\n}\nfunction debtBalance(p) {\n  const start = Number(p.fixedPrice) || 0;\n  if (start <= 0) return 0;\n  const asOf = p.balAsOf || p.buyDate || '';\n  return amortise(start, p.rate, p.monthly, monthsSince(asOf));\n}\nfunction tradesOf(p) { return Array.isArray(p.trades) ? p.trades : null; }\nfunction bookOf(p) {\n  const t = tradesOf(p);\n  if (!t || !t.length) {\n    return { units: Number(p.units) || 0, avg: Number(p.cost) || 0, realized: 0, hasLog: false };\n  }\n  const rows = t.slice().sort((x, y) => String(x.date || '').localeCompare(String(y.date || '')));\n  let units = 0, cost = 0, realized = 0;\n  rows.forEach(r => {\n    const q = Number(r.units) || 0, px = Number(r.price) || 0;\n    if (r.type === 'sell') {\n      const sold = Math.min(q, units);\n      const avg = units > 0 ? cost / units : 0;\n      realized += sold * (px - avg);\n      units -= sold; cost -= sold * avg;\n    } else {\n      units += q; cost += q * px;\n    }\n  });\n  return { units, avg: units > 0 ? cost / units : 0, realized, hasLog: true };\n}\n// Legacy rows carry no kind; derive one so nothing has to be re-entered.\nfunction kindOf(p) {\n  if (p.kind && KIND_BY[p.kind]) return p.kind;\n  if (p.gold) return 'gold';\n  if (FUND_SYMS[p.sym]) return 'fund';\n  if (DR_META.some(d => d.sym === p.sym)) return 'dr';\n  return 'other';\n}\nconst POS0 = [\n  { id: 1, pf: 'bancha', sym: 'GOOG80', units: 1062000, cost: 3.90, buyDate: '', sellDate: '', sellPrice: '' },\n  { id: 2, pf: 'bancha', sym: 'AVGO80', units: 170000, cost: 2.76, buyDate: '', sellDate: '', sellPrice: '' },\n  { id: 3, pf: 'banc  },\n  { id: 13, pf: 'mali', sym: 'GOOG80', units: 73000, cost: 4.93, buyDate: '', sellDate: '', sellPrice: '' },\n  { id: 14, pf: 'mali', sym: 'NVDA80', units: 8800, cost: 27.80, buyDate: '', sellDate: '', sellPrice: '' },\n];\nconst thDate = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + (Number(d.slice(0, 4)) + 543 - 2500) : '—';\nconst UP = '#1c8f4a', DOWN = '#c62f1c', MUT = '#82796a';\n\nfunction walk(prev, vol) { return Math.max(0.01, prev * (1 + (Math.random() - 0.5) * vol * 0.0035)); }\nfunction series(base, vol, n) {\n  const out = [base * (1 - vol * 0.012)];\n  for (let i = 1; i < n; i++) out.push(walk(out[i - 1], vol));\n  return out;\n}\nfunction path(vals, w, h, pad) {\n  const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;\n  return vals.map((v, i) => {\n    const x = (i / (vals.length - 1)) * w;\n    const y = pad + (h - pad * 2) * (1 - (v - lo) / r);\n    return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);\n  }).join(' ');\n}\nconst nf = (v, d) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });\n\nclass Component extends DCLogic {\n  constructor(p) {\n    super(p);\n    const hist = {};\n    DR_META.forEach(d => { hist[d.sym] = series(d.last || d.base, d.v, 40); });\n    this.state = {\n      tab: 'port', sel: null, tf: '1D', hist, positions: POS0, editor: null, nextId: 15, pf: 'all',\n      divs: DIV0, divEditor: null, nextDivId: 100,\n      health: [], healthEditor: null, nextHealthId: 700,\n      illness: [], illnessEditor: null, nextIllnessId: 900,\n      profile: {}, profileEdit: null,\n      docs: [], docBusy: false, docErr: '', nextDocId: 1100,\n      healthView: 'lab',\n      hqInput: '', hqChat: [], hqBusy: false, hqErr: '', hqLoading: false,\n      hqImages: [],\n      live: {}, feedUrl: '', feedInput: '', feedStatus: 'ยังไม่ได้เชื่อมต่อ — ใช้ราคาจำลอง',\n      // Empty until login: a signed-out visitor must never touch a real slot.\n      syncKey: '', syncStatus: 'ยังไม่ไ nst rows = text.trim().split(/\\r?\\n/).map(r => r.split(',').map(c => c.replace(/^\"|\"$/g, '').trim()));\n    if (!rows.length) return {};\n    const head = rows[0].map(c => c.toLowerCase());\n    let si = head.findIndex(c => /symbol|ticker|ตัวย่อ|หุ้น/.test(c));\n    let pi = head.findIndex(c => /price|last|market|ราคา/.test(c));\n    let start = 1;\n    if (si < 0 || pi < 0) { si = 0; pi = 1; start = 0; }\n    const out = {};\n    for (let i = start; i < rows.length; i++) {\n      const sym = (rows[i][si] || '').replace(/\\.BK$/i, '').toUpperCase().replace(/[\\s_\\-]/g, '');\n      const v = parseFloat((rows[i][pi] || '').replace(/[^0-9.\\-]/g, ''));\n      if (sym && isFinite(v) && v > 0) out[sym] = v;\n    }\n    return out;\n  }\n  setSyncInput() {\n    if (!this._si) this._si = e => this.setState({ syncInput: e.target.value });\n    return this._si;\n  }\n  syncUrl(key) { return '/api/sync?key=' + encodeURIComponent(key); }\n  // Push is debounced: every local edit schedules one upload a few seconds later,\n  // so a burst of edits costs one request instead of one per keystroke.\n  // Autosave stays disarmed until a pull for THIS slot has completed, so a\n  // slow or failed pull can never be followed by an empty upload.\n  queueSyncPush() {\n    // The gate exists so a failed pull can't be followed by an empty upload —\n    // but it must not become a dead end. With no UI left to force a save, a\n    // closed gate schedules its own pull, then saves once that succeeds.\n    if (this._pulledFor !== this.state.syncKey) {\n      this._pendingLocal = true;\n      if (this.state.session && this.state.syncKey) this.schedulePullRetry(400);\n      return;\n    }\n    // No session, no slot, no write. Without this an anonymous visitor's demo\n    // data would be pushed over the owner's real portfolio on first paint.\n    if (!this.state.session || !this.state.syncKey) return;\n    clearTimeout(this._syncT);\n    this._syncT = setTimeout(() => this.syncPush(), 2500) h + ' หลัง');\n    return lines.join('\\n');\n  }\n  _lastPrice(p) {\n    const k = kindOf(p);\n    if (k === 'gold') return this.state.gold.barBuy;\n    if (k === 'silver') return (this.state.live || {}).SILVER || 0;\n    if (k === 'crypto') return (this.state.live || {}).BTC || 0;\n    // Only market-quoted kinds may take a feed price. A savings account named\n    // \"SCB\" must never pick up the SCB share quote.\n    if ((KIND_BY[k] || {}).quoted) {\n      const lv = (this.state.live || {})[p.sym];\n      if (lv != null) return lv;\n    }\n    return Number(p.fixedPrice) || 0;\n  }\n  // The thread lives server-side, so it survives reload, logout and a change of\n  // device. Loaded once per session, the first time the tab is opened.\n  // Phone photos run 4-8 MB, past both the request limit and any sane token\n  // budget. Downscale to 1400px and re-encode as JPEG before sending.\n  shrinkImage(file) {\n    return new Promise((resolve, reject) => {\n      const reader = new FileReader();\n      reader.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));\n      reader.onload = () => {\n        const img = new Image();\n        img.onerror = () => reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));\n        img.onload = () => {\n          const max = 1400;\n          const scale = Math.min(1, max / Math.max(img.width, img.height));\n          const w = Math.round(img.width * scale), hh = Math.round(img.height * scale);\n          const c = document.createElement('canvas');\n          c.width = w; c.height = hh;\n          c.getContext('2d').drawImage(img, 0, 0, w, hh);\n          const url = c.toDataURL('image/jpeg', 0.82);\n          resolve({ media_type: 'image/jpeg', data: url.split(',')[1], preview: url, name: file.name });\n        };\n        img.src = reader.result;\n      };\n      reader.readAsDataURL(file);\n    });\n  }\n  onHqFiles() {\n    if (!this._hqf) this._hqf = async e => {\n      const files = Array.from(e.target.files || []).slice(0, 3);\n      e.targe e', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', 'X-Auth-Token': sess.token },\n        body: JSON.stringify({ action: 'history' }),\n      });\n      const j = await r.json();\n      this.setState({ aiLoading: false, aiChat: (j.messages || []).map(m => ({ role: m.role, text: m.text })) });\n    } catch (e) {\n      this.setState({ aiLoading: false });\n    }\n  }\n  async clearAiHistory() {\n    const sess = this.state.session;\n    this.setState({ aiChat: [], aiErr: '' });\n    if (!sess || !sess.token || sess.role === 'demo') return;\n    try {\n      await fetch('/api/advise', {\n        method: 'POST',\n        headers: { 'Content-Type': 'application/json', 'X-Auth-Token': sess.token },\n        body: JSON.stringify({ action: 'clear' }),\n      });\n    } catch (e) {}\n  }\n  async askAi() {\n    const q = (this.state.aiInput || '').trim();\n    if (!q || this.state.aiBusy) return;\n    const sess = this.state.session;\n    const history = this.state.aiChat.slice();\n    this.setState({ aiBusy: true, aiErr: '', aiInput: '',\n      aiChat: history.concat([{ role: 'user', text: q }]) });\n    const payload = { question: q, context: this.aiContext() };\n    let saveWarn = '';\n    try {\n      let text = '';\n      // In the design environment there is no /api route, but the host provides\n      // a completion bridge — use it so the screen is testable there too.\n      if (window.claude && typeof window.claude.complete === 'function') {\n        text = await window.claude.complete(AI_RULES\n          + '\\n\\nพอร์ตปัจจุบัน:\\n' + payload.context + '\\n\\nคำถาม: ' + q);\n      } else {\n        const r = await fetch('/api/advise', {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json', 'X-Auth-Token': (sess && sess.token) || '' },\n          body: JSON.stringify(payload),\n        });\n        const j = await r.json();\n        if (!r.ok) throw new Error(j.error || r.status);\n        text = j.te
