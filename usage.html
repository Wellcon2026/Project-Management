<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1B18">
<meta name="robots" content="noindex">
<title>การใช้งานระบบ · Wellcon PM</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4EFE6;--card:#FFFDF8;--line:#E4DED2;--line2:#ECE6DA;--ink:#1C1B18;--ink2:#4A4840;--mut:#8C877D;--gold:#C9A961;--goldD:#8A6D3B;--red:#C4442E;--redT:#F8E4DF;--green:#2E7D46;--greenT:#E7F3EA;--amber:#B0851B;--amberT:#FAF1D6;--blue:#2A7DA3;--blueT:#E1EEF4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stg{background:#F4D35E;color:#3A2F00;font-size:12px;text-align:center;padding:2px 8px;font-weight:600}
.hdr{position:sticky;top:0;z-index:5;background:#1C1B18;color:#F4EFE6;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.hdr b{font-size:16px;display:block;line-height:1.25}.hdr small{display:block;font-size:12px;color:#B8AE98}.hdr .grow{flex:1;min-width:0}
main{max-width:980px;margin:0 auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
.seg{display:inline-flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--ink2)}.seg button.on{background:#1C1B18;color:#F4EFE6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(46%,190px),1fr));gap:10px;margin:12px 0}
.kpi{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:13px 15px;min-width:0}.kpi .l{font-size:12.5px;color:#6E695E;font-weight:600}.kpi .v{font-size:clamp(23px,6.4vw,30px);font-weight:700;line-height:1.15;margin-top:4px}.kpi .s{font-size:12px;color:var(--mut);margin-top:3px}
.card{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:13px 15px;margin-bottom:12px}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}.ch b{font-size:16px}.ch span{font-size:12.5px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F2EDE3}.row:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.grow{flex:1;min-width:0}
.nm{font-weight:700;font-size:14.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12.5px;color:var(--mut);line-height:1.35}
.tag{flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.bar{height:8px;border-radius:8px;background:#F2EDE3;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}.chips button.on{background:#1C1B18;color:#fff;border-color:#1C1B18}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.pri{background:#1C1B18;color:#F4EFE6;border-color:#1C1B18}
.note{font-size:12.5px;color:var(--mut);line-height:1.5;margin:4px 2px 12px}
.msg{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:20px}.msg .card{max-width:420px;text-align:center}
.mods{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:13.5px}.mods .z{color:var(--red);font-weight:700}
.spin{width:30px;height:30px;border:3px solid #E4DED2;border-top-color:#C9A961;border-radius:50%;animation:sp 1s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<script src="vendor/supabase.js"></script>
<script src="wctag.js?v=1.2.2"></script>
<script src="usage.js?v=1.1.0"></script>
<script src="pm-nav.js?v=1.2.0"></script>
</body>
</html>
